    .header-shortcut-links{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:11px}.header-shortcut-links>span{color:var(--muted);font:800 9px var(--mono);letter-spacing:.08em;text-transform:uppercase}.header-shortcut-links a{display:inline-flex;align-items:center;gap:6px;max-width:230px;padding:7px 9px;border:1px solid color-mix(in srgb,var(--accent) 38%,transparent);border-radius:9px;background:color-mix(in srgb,var(--accent) 9%,transparent);color:var(--accent);font:600 11px var(--serif);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.header-shortcut-links a:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 17%,transparent);box-shadow:0 0 15px color-mix(in srgb,var(--accent) 14%,transparent)}.header-shortcut-links a i{font-style:normal}.teacher-lesson-extras{display:grid;gap:5px;margin-top:16px}.quick-prompt-reader{max-width:760px;margin-top:10px;padding:12px 14px;border-left:3px solid var(--warm);border-radius:0 10px 10px 0;background:color-mix(in srgb,var(--warm) 9%,transparent)}.quick-prompt-reader span{color:var(--warm);font:900 9px var(--mono);letter-spacing:.11em}.quick-prompt-reader p{margin:6px 0 0!important;color:var(--ink)!important;font:500 14px/1.55 var(--serif)!important;white-space:pre-wrap}.header-shortcuts-admin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 19px;border-bottom:1px solid color-mix(in srgb,var(--accent) 18%,transparent);background:color-mix(in srgb,var(--accent) 5%,transparent)}.header-shortcuts-admin small,.module-context-shortcuts small{color:var(--muted)}.lesson-tools-admin{grid-template-columns:minmax(0,1fr) auto}.lesson-tools-admin>label{grid-column:1/-1;margin-top:4px}.lesson-tools-admin textarea{width:100%;resize:vertical}.module-context-shortcuts{padding:0 19px 12px}.header-link-form-labels,.header-link-form{display:grid;grid-template-columns:minmax(150px,.8fr) minmax(260px,1.2fr);gap:8px}.header-link-form-labels{color:var(--muted);font:800 9px var(--mono);text-transform:uppercase}.organizer-lesson-private-tools{display:grid;grid-template-columns:minmax(180px,1fr) auto minmax(280px,1.2fr);gap:10px;align-items:center;margin:0 0 12px;padding:11px;border:1px solid color-mix(in srgb,var(--warm) 22%,transparent);border-radius:11px;background:color-mix(in srgb,var(--warm) 5%,transparent)}.organizer-lesson-private-tools label{margin:0}.organizer-lesson-private-tools textarea{width:100%;resize:vertical}.resource-item{grid-template-columns:38px minmax(0,1fr) 32px 30px 32px!important}.resource-item:has(.copy-check){grid-template-columns:38px 34px minmax(0,1fr) 32px 30px 32px!important}.resource-open-eye{display:grid!important;place-items:center!important;align-self:stretch;min-width:32px!important;width:32px!important;padding:0!important;border:0!important;border-left:1px solid color-mix(in srgb,var(--accent) 14%,transparent)!important;border-radius:0!important;background:color-mix(in srgb,var(--accent) 5%,transparent)!important;color:var(--accent)!important;font-size:15px!important;line-height:1!important}.resource-open-eye:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 17%,transparent)!important;text-shadow:0 0 9px var(--accent)}.resource-open-eye:disabled{opacity:.28;cursor:not-allowed}.light-theme .header-shortcut-links a{background:color-mix(in srgb,var(--accent) 10%,white)}.light-theme .quick-prompt-reader,.light-theme .organizer-lesson-private-tools{background:color-mix(in srgb,var(--warm) 8%,white)}@media(max-width:850px){.organizer-lesson-private-tools{grid-template-columns:1fr}.header-link-form-labels{display:none}.header-link-form{grid-template-columns:1fr}.header-shortcuts-admin{grid-template-columns:1fr}.header-shortcuts-admin>.btn{justify-self:start}}

<body>
<div id="app"></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<dialog id="modal"></dialog>
<script>
(()=>{
  const KEY='curriculum-builder-standalone-v1';
  const palettes={
    'blue-gold':['Antique Blue — DARK (Midnight Blue, Ivory, Antique Gold)','#050b18','#0a1d38','#102a4a','#f7f5ed','#aebed4','#74c7ff','#236fc3','#b9974f'],
    'blue-gold-light':['Antique Blue — LIGHT (Porcelain, Navy, Antique Gold)','#f4f1e8','#e5edf5','#f9fbfd','#10213b','#53657a','#0b6cae','#174f89','#8c681d'],
    'midnight-silver':['Lunar Silver — DARK (Midnight, Cyan, Silver)','#050910','#101b2b','#17283a','#f1f6fb','#aab9c8','#8de8ff','#4387a9','#c2cbd4'],
    'midnight-silver-light':['Lunar Silver — LIGHT (Frost, Slate, Cyan)','#f2f7fa','#dfeaf0','#f9fcfd','#17283a','#526575','#087c9d','#326a83','#71808b'],
    'forest-gold':['Verdant Archive — DARK (Deep Forest, Parchment, Gold)','#07100d','#10271f','#18362b','#f5f0df','#b9c2ad','#9ed8ba','#427b60','#c7a657'],
    'forest-gold-light':['Verdant Archive — LIGHT (Parchment, Forest Green, Gold)','#f4f0df','#e3eadc','#faf8ed','#173a2d','#5f6d60','#287355','#315f49','#927321'],
    'plum-rose':['Orchid Rose — DARK (Plum, Ivory, Rose Gold)','#100812','#29142f','#38203e','#fbf1ec','#cab6c9','#e7b8df','#8f568f','#c99079'],
    'plum-rose-light':['Orchid Rose — LIGHT (Blush Ivory, Plum, Rose Gold)','#fbf2f1','#f0e1eb','#fffaf8','#422344','#755d70','#9e467f','#713b72','#9d5c50'],
    'burgundy-brass':['Burgundy Brass — DARK (Burgundy, Cream, Brass)','#12090a','#32161a','#452127','#f8efe1','#cdb8ae','#efb6a1','#914852','#c09a55'],
    'burgundy-brass-light':['Burgundy Brass — LIGHT (Warm Cream, Burgundy, Brass)','#f8f0e2','#eee0d2','#fffaf1','#4a2024','#795b58','#9e463f','#76343d','#8b681f'],
    'charcoal-copper':['Copper Slate — DARK (Charcoal, Ice, Copper)','#080a0c','#1b2229','#26313a','#eef6f8','#aebbc0','#b8ecf5','#5e8791','#c68658'],
    'charcoal-copper-light':['Copper Slate — LIGHT (Mist, Charcoal, Copper)','#eef3f4','#dfe7e9','#f8fbfb','#202b32','#596970','#397486','#496d76','#9a5834']
  };
  const types=['lesson-plan','teacher-resource','slides','worksheet','reading','document','assessment','video','other'];
  const labels={'lesson-plan':'Lesson plans','teacher-resource':'Teacher resources',slides:'Slide decks',worksheet:'Worksheets',reading:'Readings',document:'Documents',assessment:'Assessments',video:'Videos',other:'Other'};
  const icons={'lesson-plan':'☷','teacher-resource':'◆',slides:'▣',worksheet:'✎',reading:'◫',document:'▤',assessment:'✓',video:'▶',other:'◇'};
  const forcedTeacherTypes=new Set(['lesson-plan','teacher-resource']);
  function normalizedResource(r){return{...r,audience:forcedTeacherTypes.has(r.type)?'teacher':(r.audience==='both'?'student':r.audience||'student')}}
  const audiences=[['student','Student + Teacher materials'],['teacher','Teacher Only materials']];
  let library=load(),activeId=null,selectedModule=null,selectedLesson=null,mode='build',readerOnly=false,externalCurriculum=null,externalReaderLibrary=null,editFocus='module',readerAudience='teacher',readerLayoutOverride=null,readerOverview=false,readerOverviewExpanded=new Set(),organizerSearch='',organizerSelection=new Set(),organizerExpandedLessons=new Set(),organizerCollapsedModules=new Set(),organizerResourceViews=new Map(),resourceManagerOpen=false,lastMovedId=null,undoStack=[],redoStack=[];
  const app=document.getElementById('app'),modal=document.getElementById('modal'),fileInput=document.getElementById('importFile');
  app.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.readerLayout){event.preventDefault();event.stopImmediatePropagation();readerLayoutOverride=button.dataset.readerLayout;render();return}if(button.matches('[data-back]')){event.preventDefault();event.stopImmediatePropagation();selectedLesson=null;render();return}const section=button.closest('.resource-section'),target=section?{kind:section.dataset.targetKind,id:section.dataset.targetId}:null;if(button.dataset.resourceLayout&&target){event.preventDefault();event.stopImmediatePropagation();setResourceLayout(target,button.dataset.resourceLayout);return}if(button.matches('[data-apply-layout]')&&target){event.preventDefault();event.stopImmediatePropagation();applyLayoutToModule(resourceOwner(target)?.resourceLayout||'category');return}if(button.matches('[data-reset-resource-order]')&&target){event.preventDefault();event.stopImmediatePropagation();resetResourceOrder(target)}},true);
  document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(current()&&!readerOnly)commandPalette();return}if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'){event.preventDefault();event.shiftKey?redoAction():undoAction()}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='y'){event.preventDefault();redoAction()}});
  function syncForcedAudienceControls(){modal.querySelectorAll('select[name="type"],select[name="bulkType"]').forEach(type=>{const scope=type.closest('.bulk-row')||type.closest('form')||modal,audience=scope.querySelector('select[name="audience"],select[name="bulkAudience"]');if(!audience)return;const wasForced=audience.dataset.forced==='true',forced=forcedTeacherTypes.has(type.value);if(forced)audience.value='teacher';else if(wasForced)audience.value='student';audience.dataset.forced=forced;audience.setAttribute('aria-disabled',String(forced));audience.title=forced?'This document type is always Teacher Only':''})}
  modal.addEventListener('change',event=>{if(event.target.matches('select[name="type"],select[name="bulkType"]'))syncForcedAudienceControls()});new MutationObserver(syncForcedAudienceControls).observe(modal,{childList:true,subtree:true});
  const id=p=>p+'_'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const essentialQuestions=value=>String(value||'').split(/\r?\n/).map(question=>question.trim()).filter(Boolean);
  const essentialQuestionList=value=>`<ul class="essential-question-list">${essentialQuestions(value).map(question=>`<li>${esc(question)}</li>`).join('')}</ul>`;
  function normalizeAudienceData(data){const normalize=c=>{if(c)c.resources=(c.resources||[]).map(normalizedResource);for(const m of c?.modules||[]){m.resources=(m.resources||[]).map(normalizedResource);for(const l of m.lessons||[])l.resources=(l.resources||[]).map(normalizedResource)}return c};if(data?.curricula)data.curricula=data.curricula.map(normalize);else if(data?.curriculum)data.curriculum=normalize(data.curriculum);else normalize(data);return data}
  function load(){try{return normalizeAudienceData(JSON.parse(localStorage.getItem(KEY)))||{format:'curriculum-builder-library',version:1,activeId:null,curricula:[]}}catch{return{format:'curriculum-builder-library',version:1,activeId:null,curricula:[]}}}
  function save(){library.activeId=activeId;localStorage.setItem(KEY,JSON.stringify(library))}
  function current(){return normalizeAudienceData(externalCurriculum||library.curricula.find(c=>c.id===activeId)||null)}
  function update(fn,recordHistory=true){const i=library.curricula.findIndex(c=>c.id===activeId);if(i<0)return;if(recordHistory){undoStack.push(structuredClone(library.curricula[i]));if(undoStack.length>30)undoStack.shift();redoStack=[]}library.curricula[i]=fn(library.curricula[i]);library.curricula[i].updatedAt=new Date().toISOString();save();render()}
  function notify(text){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=text;document.body.append(n);setTimeout(()=>n.remove(),2400)}
  function theme(c){const p=palettes[c?.palette]||palettes['blue-gold'];return `--bg0:${p[1]};--bg1:${p[2]};--panel:${p[3]};--ink:${p[4]};--muted:${p[5]};--accent:${p[6]};--metal:${p[7]};--warm:${p[8]}`}
  function top(c){return `<header class="top"><button class="brand" data-home><span class="mark">CP</span><span><b>Curriculum Planner</b><small>HOLOGRAPHIC DEPLOYMENT CONSOLE</small></span></button><div class="actions">${c&&!readerOnly?`<button class="btn ghost ${mode==='build'?'on':''}" data-mode="build">Admin builder</button><button class="btn ghost ${mode==='reader'?'on':''}" data-mode="reader">Reader preview</button>`:''}${c&&(mode==='reader'||readerOnly)?`<span class="view-switch"><button class="btn ghost ${readerAudience==='student'?'on':''}" data-audience-mode="student">Student view</button>${!readerOnly||readerAudience==='teacher'?`<button class="btn ghost ${readerAudience==='teacher'?'on':''}" data-audience-mode="teacher">Teacher view</button>`:''}</span>`:''}${readerOnly?`<span class="reader-only-note">${readerAudience.toUpperCase()} READER DEPLOYMENT</span>`:''}${!readerOnly&&library.curricula.length?'<button class="btn primary" data-download-center>Download</button>':''}<button class="btn ghost hide-mobile" data-import>Import JSON</button>${!readerOnly?'<button class="btn primary" data-new>＋ New curriculum</button>':''}</div></header>`}
  function empty(){return `<main class="app" style="${theme()}">${top(null)}<section class="empty"><span class="eyebrow">PORTABLE CURRICULUM PUBLISHING</span><h1>Build the learning path.<br><em>Deploy the experience.</em></h1><p>Create modular curricula, connect Google materials, export portable source and reader JSON files, and publish a polished curriculum experience from one standalone page.</p><div class="actions"><button class="btn primary" data-new>Create your first curriculum</button><button class="btn ghost" data-import>Import source JSON</button></div></section></main>`}
  function libraryLanding(){return `<main class="app">${top(null)}<section class="library-stage"><div class="library-copy"><span class="eyebrow">CURRICULUM LIBRARY</span><h1>Curriculum<br><em>Builder</em></h1><p>Select a curriculum to project its modules, or begin a new learning path.</p><div class="actions"><button class="btn primary" data-new>＋ New curriculum</button><button class="btn ghost" data-import>Import JSON</button></div></div><div class="library-grid">${library.curricula.length?library.curricula.map((c,i)=>`<article class="holo-curriculum-card"><button data-open-curriculum="${c.id}"><span>CURRICULUM ${String(i+1).padStart(2,'0')}</span><h2>${esc(c.title)}</h2><p>${esc(c.subtitle||'A modular learning experience')}</p><small>${c.modules.length} modules · ${c.modules.reduce((n,m)=>n+m.lessons.length,0)} lessons</small></button><button class="delete-curriculum" data-delete-curriculum="${c.id}" title="Delete curriculum">×</button></article>`).join(''):`<button class="holo-curriculum-card empty-card" data-new><span>NO CURRICULA YET</span><h2>Create the first curriculum</h2></button>`}</div></section></main>`}
  function resourceOwner(target){const c=current();if(target.kind==='curriculum')return c;if(target.kind==='module')return c?.modules.find(m=>m.id===target.id);for(const m of c?.modules||[]){const l=m.lessons.find(x=>x.id===target.id);if(l)return l}}
  function resourceItem(r,editable,target){return editable?`<div class="resource-item ${r.url?'':'needs-link'}" data-resource-type="${r.type}" data-drop-resource="${r.id}"><span class="resource-drag-handle" data-drag-resource="${r.id}" data-resource-type="${r.type}" title="Drag to reorder" aria-label="Drag ${esc(r.name)} to reorder">⠿</span>${target.kind==='lesson'?`<label class="copy-check" title="Select for copying"><input type="checkbox" data-copy-select value="${r.id}"><span>✓</span></label>`:''}<button data-edit-resource="${r.id}" data-target-kind="${target.kind}" data-target-id="${target.id}"><b>${esc(r.name)}</b><small>${r.url?'Drag the handle or use arrows to reorder · click to edit':'LINK NEEDED · click to add URL'}</small></button><span class="resource-order-controls"><button type="button" data-resource-step="-1" data-resource-step-id="${r.id}" title="Move up" aria-label="Move ${esc(r.name)} up">↑</button><button type="button" data-resource-step="1" data-resource-step-id="${r.id}" title="Move down" aria-label="Move ${esc(r.name)} down">↓</button></span><button class="remove" data-delete-resource="${r.id}">×</button></div>`:`${r.url?`<button class="viewer-resource" data-open-viewer="${r.id}"><div><b>${esc(r.name)}</b><small>${esc(r.description||labels[r.type])}</small></div><i>▣</i></button>`:''}`}
  function grouped(resources,editable,target,allowed=audiences.map(x=>x[0])){if(!resources?.length&&!editable)return '<p class="none">No resources linked yet.</p>';return audiences.filter(([aud])=>allowed.includes(aud)).map(([aud,label])=>{const boxes=types.map(type=>{const items=(resources||[]).filter(r=>r.audience===aud&&r.type===type);if(!items.length)return'';return `<div class="type-box" ${editable?`data-drop-type="${type}" data-drop-audience="${aud}"`:''}><header><span>${icons[type]}</span><b>${labels[type]}</b><small>${items.length}</small></header>${items.map(r=>resourceItem(r,editable,target)).join('')}</div>`}).join('');return `<section class="audience ${aud} ${boxes?'has-items':'is-empty'}" ${editable?`data-drop-audience="${aud}"`:''}><h4>${label}</h4>${boxes?`<div class="type-grid">${boxes}</div>`:'<div class="empty-drop">Empty · drop here</div>'}</section>`}).join('')}
  function manualResources(resources,editable,target,allowed=audiences.map(x=>x[0])){if(!resources?.length&&!editable)return'';return audiences.filter(([aud])=>allowed.includes(aud)).map(([aud,label])=>{const items=(resources||[]).filter(r=>r.audience===aud);if(!items.length&&!editable)return'';return `<section class="audience manual-audience ${aud}" ${editable?`data-drop-audience="${aud}"`:''}><h4>${label}</h4><div class="manual-list">${items.map(r=>`<div class="manual-wrap"><span class="type-chip">${icons[r.type]} ${labels[r.type]}</span>${resourceItem(r,editable,target)}</div>`).join('')||'<div class="empty-drop">Empty · drop here</div>'}</div></section>`}).join('')}
  function resourceSection(title,resources,target){const layout=resourceOwner(target)?.resourceLayout||'category';return `<section class="resource-section" data-target-kind="${target.kind}" data-target-id="${target.id}"><div class="resource-head"><span>${title}</span><div class="layout-toggle"><button class="${layout==='category'?'on':''}" data-resource-layout="category">Organize by category</button><button class="${layout==='manual'?'on':''}" data-resource-layout="manual">Arrange by order</button></div><div>${target.kind==='lesson'?'<button data-apply-layout title="Use this display mode for every lesson in the current module">Apply mode to module</button>':''}<button data-reset-resource-order title="Restore the standard student/shared/teacher and document-type sequence">Reset order</button>${target.kind==='lesson'&&resources.length?'<button data-copy-resources>⧉ Copy selected</button>':''}<button data-bulk-resource data-target-kind="${target.kind}" data-target-id="${target.id}">＋ Bulk add</button><button data-add-resource data-target-kind="${target.kind}" data-target-id="${target.id}">＋ Link Google resource</button></div></div>${layout==='manual'?manualResources(resources,true,target):grouped(resources,true,target)}</section>`}
  function visibleResources(resources){return (resources||[]).filter(r=>r.url&&!['draft','hidden'].includes(r.status)&&(readerAudience==='teacher'||r.audience!=='teacher'))}
  function unitMaterialsPanel(c){const resources=visibleResources(c.resources||[]);if(!resources.length)return'';const row=r=>`<button class="unit-material-link" data-open-viewer="${r.id}"><i>${icons[r.type]||icons.document}</i><span><b>${esc(r.name)}</b><small>${labels[r.type]||'Document'}${r.audience==='teacher'?' · Teacher Only':''}</small></span><em>↗</em></button>`,primary=resources.slice(0,3),extra=resources.slice(3);return `<section class="unit-materials-panel"><header><span class="eyebrow">UNIT MATERIALS</span><small>${resources.length} document${resources.length===1?'':'s'}</small></header><div>${primary.map(row).join('')}</div>${extra.length?`<details><summary>View ${extra.length} more</summary><div>${extra.map(row).join('')}</div></details>`:''}</section>`}
