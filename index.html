<script>

    'plum-rose-light':['Orchid Rose — LIGHT (Blush Ivory, Plum, Rose Gold)','#fbf2f1','#f0e1eb','#fffaf8','#422344','#755d70','#9e467f','#713b72','#9d5c50'],
    'burgundy-brass':['Burgundy Brass — DARK (Burgundy, Cream, Brass)','#12090a','#32161a','#452127','#f8efe1','#cdb8ae','#efb6a1','#914852','#c09a55'],
    'burgundy-brass-light':['Burgundy Brass — LIGHT (Warm Cream, Burgundy, Brass)','#f8f0e2','#eee0d2','#fffaf1','#4a2024','#795b58','#9e463f','#76343d','#8b681f'],
    'charcoal-copper':['Copper Slate — DARK (Charcoal, Ice, Copper)','#080a0c','#1b2229','#26313a','#eef6f8','#aebbc0','#b8ecf5','#5e8791','#c68658'],
    'charcoal-copper-light':['Copper Slate — LIGHT (Mist, Charcoal, Copper)','#eef3f4','#dfe7e9','#f8fbfb','#202b32','#596970','#397486','#496d76','#9a5834']
  };
  const types=['lesson-plan','teacher-resource','slides','worksheet','reading','document','assessment','video','other'];
  const labels={'lesson-plan':'Lesson plans','teacher-resource':'Teacher resources',slides:'Slide decks',worksheet:'Worksheets',reading:'Readings',document:'Documents',assessment:'Assessments',video:'Videos',other:'Other'};
  const icons={'lesson-plan':'☷','teacher-resource':'◆',slides:'▣',worksheet:'✎',reading:'◫',document:'▤',assessment:'✓',video:'▶',other:'◇'};
  const forcedTeacherTypes=new Set(['lesson-plan','teacher-resource']);
  function normalizedResource(r){return{...r,audience:forcedTeacherTypes.has(r.type)?'teacher':(r.audience==='both'?'student':r.audience||'student')}}
  const audiences=[['student','Student + Teacher materials'],['teacher','Teacher Only materials']];
  let library=load(),activeId=null,selectedModule=null,selectedLesson=null,mode='build',readerOnly=false,externalCurriculum=null,editFocus='module',readerAudience='teacher',readerLayoutOverride=null,organizerSearch='',organizerSelection=new Set(),organizerExpandedLessons=new Set(),organizerCollapsedModules=new Set(),organizerResourceViews=new Map(),resourceManagerOpen=false,lastMovedId=null,undoStack=[],redoStack=[];
  const app=document.getElementById('app'),modal=document.getElementById('modal'),fileInput=document.getElementById('importFile');
  app.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.readerLayout){event.preventDefault();event.stopImmediatePropagation();readerLayoutOverride=button.dataset.readerLayout;render();return}if(button.matches('[data-back]')){event.preventDefault();event.stopImmediatePropagation();selectedLesson=null;render();return}const section=button.closest('.resource-section'),target=section?{kind:section.dataset.targetKind,id:section.dataset.targetId}:null;if(button.dataset.resourceLayout&&target){event.preventDefault();event.stopImmediatePropagation();setResourceLayout(target,button.dataset.resourceLayout);return}if(button.matches('[data-apply-layout]')&&target){event.preventDefault();event.stopImmediatePropagation();applyLayoutToModule(resourceOwner(target)?.resourceLayout||'category');return}if(button.matches('[data-reset-resource-order]')&&target){event.preventDefault();event.stopImmediatePropagation();resetResourceOrder(target)}},true);
  document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(current()&&!readerOnly)commandPalette();return}if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'){event.preventDefault();event.shiftKey?redoAction():undoAction()}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='y'){event.preventDefault();redoAction()}});
  function syncForcedAudienceControls(){modal.querySelectorAll('select[name="type"],select[name="bulkType"]').forEach(type=>{const scope=type.closest('.bulk-row')||type.closest('form')||modal,audience=scope.querySelector('select[name="audience"],select[name="bulkAudience"]');if(!audience)return;const wasForced=audience.dataset.forced==='true',forced=forcedTeacherTypes.has(type.value);if(forced)audience.value='teacher';else if(wasForced)audience.value='student';audience.dataset.forced=forced;audience.setAttribute('aria-disabled',String(forced));audience.title=forced?'This document type is always Teacher Only':''})}
  modal.addEventListener('change',event=>{if(event.target.matches('select[name="type"],select[name="bulkType"]'))syncForcedAudienceControls()});new MutationObserver(syncForcedAudienceControls).observe(modal,{childList:true,subtree:true});
  const id=p=>p+'_'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function normalizeAudienceData(data){const normalize=c=>{for(const m of c?.modules||[]){m.resources=(m.resources||[]).map(normalizedResource);for(const l of m.lessons||[])l.resources=(l.resources||[]).map(normalizedResource)}return c};if(data?.curricula)data.curricula=data.curricula.map(normalize);else if(data?.curriculum)data.curriculum=normalize(data.curriculum);else normalize(data);return data}
  function load(){try{return normalizeAudienceData(JSON.parse(localStorage.getItem(KEY)))||{format:'curriculum-builder-library',version:1,activeId:null,curricula:[]}}catch{return{format:'curriculum-builder-library',version:1,activeId:null,curricula:[]}}}
  function save(){library.activeId=activeId;localStorage.setItem(KEY,JSON.stringify(library))}
  function current(){return normalizeAudienceData(externalCurriculum||library.curricula.find(c=>c.id===activeId)||null)}
  function update(fn,recordHistory=true){const i=library.curricula.findIndex(c=>c.id===activeId);if(i<0)return;if(recordHistory){undoStack.push(structuredClone(library.curricula[i]));if(undoStack.length>30)undoStack.shift();redoStack=[]}library.curricula[i]=fn(library.curricula[i]);library.curricula[i].updatedAt=new Date().toISOString();save();render()}
  function notify(text){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=text;document.body.append(n);setTimeout(()=>n.remove(),2400)}
  function theme(c){const p=palettes[c?.palette]||palettes['blue-gold'];return `--bg0:${p[1]};--bg1:${p[2]};--panel:${p[3]};--ink:${p[4]};--muted:${p[5]};--accent:${p[6]};--metal:${p[7]};--warm:${p[8]}`}
  function top(c){return `<header class="top"><button class="brand" data-home><span class="mark">CP</span><span><b>Curriculum Planner</b><small>HOLOGRAPHIC DEPLOYMENT CONSOLE</small></span></button><div class="actions">${c&&!readerOnly?`<button class="btn ghost ${mode==='build'?'on':''}" data-mode="build">Admin builder</button><button class="btn ghost ${mode==='reader'?'on':''}" data-mode="reader">Reader preview</button>`:''}${c&&(mode==='reader'||readerOnly)?`<span class="view-switch"><button class="btn ghost ${readerAudience==='student'?'on':''}" data-audience-mode="student">Student view</button>${!readerOnly||readerAudience==='teacher'?`<button class="btn ghost ${readerAudience==='teacher'?'on':''}" data-audience-mode="teacher">Teacher view</button>`:''}</span>`:''}${mode==='build'&&selectedModule&&!readerOnly?'<button class="btn ghost" data-export-unit="student">Student unit</button><button class="btn ghost" data-export-unit="teacher">Teacher unit</button>':''}${readerOnly?`<span class="reader-only-note">${readerAudience.toUpperCase()} READER DEPLOYMENT</span>`:''}<button class="btn ghost hide-mobile" data-import>Import JSON</button>${!readerOnly?'<button class="btn primary" data-new>＋ New curriculum</button>':''}</div></header>`}
  function empty(){return `<main class="app" style="${theme()}">${top(null)}<section class="empty"><span class="eyebrow">PORTABLE CURRICULUM PUBLISHING</span><h1>Build the learning path.<br><em>Deploy the experience.</em></h1><p>Create modular curricula, connect Google materials, export portable source and reader JSON files, and publish a polished curriculum experience from one standalone page.</p><div class="actions"><button class="btn primary" data-new>Create your first curriculum</button><button class="btn ghost" data-import>Import source JSON</button></div></section></main>`}
  function libraryLanding(){return `<main class="app">${top(null)}<section class="library-stage"><div class="library-copy"><span class="eyebrow">CURRICULUM LIBRARY</span><h1>Curriculum<br><em>Builder</em></h1><p>Select a curriculum to project its modules, or begin a new learning path.</p><div class="actions"><button class="btn primary" data-new>＋ New curriculum</button><button class="btn ghost" data-import>Import JSON</button></div></div><div class="library-grid">${library.curricula.length?library.curricula.map((c,i)=>`<article class="holo-curriculum-card"><button data-open-curriculum="${c.id}"><span>CURRICULUM ${String(i+1).padStart(2,'0')}</span><h2>${esc(c.title)}</h2><p>${esc(c.subtitle||'A modular learning experience')}</p><small>${c.modules.length} modules · ${c.modules.reduce((n,m)=>n+m.lessons.length,0)} lessons</small></button><button class="delete-curriculum" data-delete-curriculum="${c.id}" title="Delete curriculum">×</button></article>`).join(''):`<button class="holo-curriculum-card empty-card" data-new><span>NO CURRICULA YET</span><h2>Create the first curriculum</h2></button>`}</div></section></main>`}
  function resourceOwner(target){const c=current();if(target.kind==='module')return c?.modules.find(m=>m.id===target.id);for(const m of c?.modules||[]){const l=m.lessons.find(x=>x.id===target.id);if(l)return l}}
  function resourceItem(r,editable,target){return editable?`<div class="resource-item ${r.url?'':'needs-link'}" data-resource-type="${r.type}" data-drop-resource="${r.id}"><span class="resource-drag-handle" draggable="true" data-drag-resource="${r.id}" data-resource-type="${r.type}" title="Drag to reorder" aria-label="Drag ${esc(r.name)} to reorder">⠿</span>${target.kind==='lesson'?`<label class="copy-check" title="Select for copying"><input type="checkbox" data-copy-select value="${r.id}"><span>✓</span></label>`:''}<button data-edit-resource="${r.id}" data-target-kind="${target.kind}" data-target-id="${target.id}"><b>${esc(r.name)}</b><small>${r.url?'Drag the handle to reorder · click to edit':'LINK NEEDED · click to add URL'}</small></button><button class="remove" data-delete-resource="${r.id}">×</button></div>`:`${r.url?`<button class="viewer-resource" data-open-viewer="${r.id}"><div><b>${esc(r.name)}</b><small>${esc(r.description||labels[r.type])}</small></div><i>▣</i></button>`:''}`}
  function grouped(resources,editable,target,allowed=audiences.map(x=>x[0])){if(!resources?.length&&!editable)return '<p class="none">No resources linked yet.</p>';return audiences.filter(([aud])=>allowed.includes(aud)).map(([aud,label])=>{const boxes=types.map(type=>{const items=(resources||[]).filter(r=>r.audience===aud&&r.type===type);if(!items.length)return'';return `<div class="type-box" ${editable?`data-drop-type="${type}" data-drop-audience="${aud}"`:''}><header><span>${icons[type]}</span><b>${labels[type]}</b><small>${items.length}</small></header>${items.map(r=>resourceItem(r,editable,target)).join('')}</div>`}).join('');return `<section class="audience ${aud} ${boxes?'has-items':'is-empty'}" ${editable?`data-drop-audience="${aud}"`:''}><h4>${label}</h4>${boxes?`<div class="type-grid">${boxes}</div>`:'<div class="empty-drop">Empty · drop here</div>'}</section>`}).join('')}

  function setResourceLayout(target,layout){update(c=>({...c,modules:c.modules.map(m=>target.kind==='module'&&m.id===target.id?{...m,resourceLayout:layout}:{...m,lessons:m.lessons.map(l=>target.kind==='lesson'&&l.id===target.id?{...l,resourceLayout:layout}:l)})}))}
  function applyLayoutToModule(layout){update(c=>({...c,modules:c.modules.map(m=>m.id===selectedModule?{...m,lessons:m.lessons.map(l=>({...l,resourceLayout:layout}))}:m)}));notify('Display mode applied to every lesson in this module')}
  function resetResourceOrder(target){const audienceOrder=['student','teacher'],sort=list=>list.map((r,i)=>({r:{...r,audience:r.audience==='both'?'student':r.audience},i})).sort((a,b)=>audienceOrder.indexOf(a.r.audience)-audienceOrder.indexOf(b.r.audience)||types.indexOf(a.r.type)-types.indexOf(b.r.type)||a.i-b.i).map(x=>x.r);update(c=>({...c,modules:c.modules.map(m=>target.kind==='module'&&m.id===target.id?{...m,resources:sort(m.resources)}:{...m,lessons:m.lessons.map(l=>target.kind==='lesson'&&l.id===target.id?{...l,resources:sort(l.resources)}:l)})}));notify('Resource order reset')}
  function findResource(rid){for(const m of current().modules){const a=m.resources.find(r=>r.id===rid);if(a)return a;for(const l of m.lessons){const b=l.resources.find(r=>r.id===rid);if(b)return b}}}
  function deleteResource(rid){if(!confirm('Remove this resource link?'))return;update(c=>({...c,modules:c.modules.map(m=>({...m,resources:m.resources.filter(r=>r.id!==rid),lessons:m.lessons.map(l=>({...l,resources:l.resources.filter(r=>r.id!==rid)}))}))}))}
  function deleteModule(){if(!confirm('Delete this module and all of its lessons?'))return;update(c=>({...c,modules:c.modules.filter(m=>m.id!==selectedModule)}));selectedModule=selectedLesson=null;render()}
  function deleteLesson(){if(!confirm('Delete this lesson and its resource links?'))return;update(c=>({...c,modules:c.modules.map(m=>({...m,lessons:m.lessons.filter(l=>l.id!==selectedLesson)}))}));selectedLesson=null;render()}
  function moveModule(delta){update(c=>{const a=[...c.modules],i=a.findIndex(m=>m.id===selectedModule),j=i+delta;if(j<0||j>=a.length)return c;[a[i],a[j]]=[a[j],a[i]];return{...c,modules:a}})}
  function curriculumForAudience(c,audience){const copy=deployedCurriculum(c);if(audience==='student')copy.modules=copy.modules.map(m=>({...m,resources:m.resources.filter(r=>r.audience!=='teacher'),lessons:m.lessons.map(l=>({...l,resources:l.resources.filter(r=>r.audience!=='teacher')}))}));return copy}
  function downloadJson(payload,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
  function exportJson(kind){const c=current(),slug=c.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'curriculum';if(kind==='admin'){downloadJson({format:'curriculum-builder-source',schemaVersion:2,exportKind:'admin-builder-source',...c},`${slug}-admin.json`);notify('Admin builder JSON exported');return}const audience=kind==='student'?'student':'teacher',payload={format:'curriculum-builder-reader',schemaVersion:2,exportKind:`${audience}-reader-deployment`,audienceMode:audience,curriculum:curriculumForAudience(c,audience)};downloadJson(payload,`${slug}-${audience}-reader.json`);notify(`${audience[0].toUpperCase()+audience.slice(1)} reader JSON exported`)}
  function exportUnit(audience='teacher'){const c=current(),m=c?.modules.find(module=>module.id===selectedModule);if(!c||!m)return;const unit=curriculumForAudience({...c,id:`${c.id}-${m.id}`,title:`${c.title} — ${m.title}`,modules:[m]},audience),slug=unit.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'unit',payload={format:'curriculum-builder-reader',schemaVersion:2,exportKind:`${audience}-unit-reader-deployment`,audienceMode:audience,curriculum:unit};downloadJson(payload,`${slug}-${audience}-unit-reader.json`);notify(`${audience[0].toUpperCase()+audience.slice(1)} unit reader JSON exported`)}
  app.addEventListener('click',event=>{const target=event.target.closest('button');if(!target)return;if(target.dataset.audienceMode){readerAudience=target.dataset.audienceMode;render();return}if(target.dataset.openViewer){openResourceViewer(target.dataset.openViewer);return}if(target.matches('[data-home]')&&!readerOnly){event.preventDefault();event.stopImmediatePropagation();activeId=null;selectedModule=selectedLesson=null;mode='build';save();render();return}if(target.dataset.openCurriculum){activeId=target.dataset.openCurriculum;selectedModule=selectedLesson=null;mode='reader';readerAudience='teacher';save();render();return}if(target.dataset.deleteCurriculum){event.preventDefault();event.stopPropagation();const curriculum=library.curricula.find(c=>c.id===target.dataset.deleteCurriculum);if(curriculum&&confirm(`Delete “${curriculum.title}” from this browser?`)){library.curricula=library.curricula.filter(c=>c.id!==curriculum.id);if(activeId===curriculum.id)activeId=null;save();render();notify('Curriculum deleted')}return}if(target.matches('[data-export-unit]'))exportUnit(target.dataset.exportUnit||'teacher')},true);
  fileInput.onchange=()=>{const file=fileInput.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const raw=JSON.parse(reader.result);if(raw.format==='curriculum-builder-reader'){externalCurriculum=raw.curriculum;readerOnly=true;readerAudience=raw.audienceMode||'teacher';mode='reader';selectedModule=selectedLesson=null}else if(['curriculum-builder-source','curriculum-forge'].includes(raw.format)){library.curricula=library.curricula.filter(c=>c.id!==raw.id);library.curricula.push(raw);activeId=raw.id;externalCurriculum=null;readerOnly=false;readerAudience='teacher';mode='build';save()}else throw 0;render();notify('JSON loaded')}catch{alert('That is not a valid Curriculum Builder JSON file.')}fileInput.value=''};reader.readAsText(file)};
  async function loadHosted(){const src=new URLSearchParams(location.search).get('curriculum');if(!src)return false;try{const res=await fetch(src);if(!res.ok)throw 0;const raw=await res.json();externalCurriculum=raw.format==='curriculum-builder-reader'?raw.curriculum:raw;readerAudience=raw.audienceMode||'teacher';readerOnly=true;mode='reader';return true}catch{alert('The hosted curriculum JSON could not be loaded.');return false}}
  loadHosted().finally(render);
})();
</script>
