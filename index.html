    .library-copy h1{max-width:390px;font-size:clamp(44px,4.6vw,68px);line-height:.92;letter-spacing:-.045em}.library-copy h1 em{font-size:0}.library-copy h1 em:after{content:"Planner";font-size:clamp(44px,4.6vw,68px)}.library-copy{padding-right:18px}@media(max-width:700px){.library-copy h1,.library-copy h1 em:after{font-size:48px}}
    .resource-columns{direction:ltr}.resource-column.student-col{order:1;grid-column:1}.resource-column.teacher-col{order:2;grid-column:2}.type-box header span{display:grid;place-items:center;width:30px;height:30px;border:1px solid color-mix(in srgb,var(--accent) 62%,transparent);border-radius:8px;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,transparent),color-mix(in srgb,var(--accent) 6%,transparent));color:#bce6ff!important;font:900 14px/1 var(--mono);text-shadow:0 0 9px var(--accent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 16%,transparent)}.teacher-col .type-box header span{border-color:color-mix(in srgb,var(--warm) 62%,transparent);color:#f3d28d!important;text-shadow:0 0 9px var(--warm)}.type-box header{grid-template-columns:36px 1fr auto}@media(max-width:700px){.resource-column.student-col,.resource-column.teacher-col{grid-column:1}}
    .library-grid{column-gap:28px;row-gap:26px;padding-left:8%}.library-grid>.holo-curriculum-card:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 14px)}.holo-curriculum-card,.photon-module{animation:photon-card-flicker 7.6s steps(1,end) infinite}.holo-curriculum-card:nth-child(2n),.photon-module:nth-child(2n){animation-delay:-3.1s;animation-duration:8.9s}.holo-curriculum-card:nth-child(3n),.photon-module:nth-child(3n){animation-delay:-5.2s;animation-duration:10.4s}.library-stage:before,.home-stage:before{content:"";position:absolute;z-index:2;right:3%;bottom:5%;width:67%;height:65%;pointer-events:none;background:radial-gradient(ellipse at 50% 92%,#69b9ff55 0%,#288cff20 28%,transparent 67%);filter:blur(16px);mix-blend-mode:screen;animation:emitter-light-flicker 6.7s steps(1,end) infinite}@keyframes photon-card-flicker{0%,18%,22%,61%,64%,100%{opacity:1;filter:brightness(1)}19%{opacity:.94;filter:brightness(.92)}20%{opacity:.985;filter:brightness(1.08)}62%{opacity:.965;filter:brightness(.96)}63%{opacity:1;filter:brightness(1.05)}}@keyframes emitter-light-flicker{0%,27%,31%,72%,75%,100%{opacity:.82;filter:blur(16px) brightness(1)}28%{opacity:.69;filter:blur(17px) brightness(.9)}29%{opacity:.88;filter:blur(15px) brightness(1.08)}73%{opacity:.75;filter:blur(17px) brightness(.96)}74%{opacity:.86;filter:blur(15px) brightness(1.04)}}.resource-column:not(:has(.type-box)){display:none}.resource-columns:has(>.student-col:not(:has(.type-box)))>.teacher-col{grid-column:1/-1}.resource-columns:has(>.teacher-col:not(:has(.type-box)))>.student-col{grid-column:1/-1}.resource-columns:not(:has(.type-box)){display:none}@media(max-width:700px){.library-grid{padding-left:5%;gap:16px}.library-grid>.holo-curriculum-card:last-child:nth-child(odd){grid-column:1;width:100%}}@media(prefers-reduced-motion:reduce){.holo-curriculum-card,.photon-module,.library-stage:before,.home-stage:before{animation:none}}

<body>
<div id="app"></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<dialog id="modal"></dialog>
<script>
(()=>{
  const KEY='curriculum-builder-standalone-v1';
  const palettes={
    'blue-gold':['Blue · White · Dark Gold','#050b18','#0a1d38','#102a4a','#f7f5ed','#aebed4','#74c7ff','#236fc3','#b9974f'],
    'midnight-silver':['Midnight · Cyan · Silver','#050910','#101b2b','#17283a','#f1f6fb','#aab9c8','#8de8ff','#4387a9','#c2cbd4'],
    'forest-gold':['Forest · Parchment · Gold','#07100d','#10271f','#18362b','#f5f0df','#b9c2ad','#9ed8ba','#427b60','#c7a657'],
    'plum-rose':['Plum · Ivory · Rose Gold','#100812','#29142f','#38203e','#fbf1ec','#cab6c9','#e7b8df','#8f568f','#c99079'],
    'burgundy-brass':['Burgundy · Cream · Brass','#12090a','#32161a','#452127','#f8efe1','#cdb8ae','#efb6a1','#914852','#c09a55'],
    'charcoal-copper':['Charcoal · Ice · Copper','#080a0c','#1b2229','#26313a','#eef6f8','#aebbc0','#b8ecf5','#5e8791','#c68658']
  };
  const types=['lesson-plan','slides','worksheet','reading','document','assessment','video','other'];
  const labels={'lesson-plan':'Lesson plans',slides:'Slide decks',worksheet:'Worksheets',reading:'Readings',document:'Documents',assessment:'Assessments',video:'Videos',other:'Other'};
  const icons={'lesson-plan':'☷',slides:'▣',worksheet:'✎',reading:'◫',document:'▤',assessment:'✓',video:'▶',other:'◇'};
  const audiences=[['student','Student-facing materials'],['both','Shared materials'],['teacher','Teacher-facing materials']];
  let library=load(),activeId=null,selectedModule=null,selectedLesson=null,mode='build',readerOnly=false,externalCurriculum=null;
  const app=document.getElementById('app'),modal=document.getElementById('modal'),fileInput=document.getElementById('importFile');
  const id=p=>p+'_'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||{format:'curriculum-builder-library',version:1,activeId:null,curricula:[]}}catch{return{format:'curriculum-builder-library',version:1,activeId:null,curricula:[]}}}
  function save(){library.activeId=activeId;localStorage.setItem(KEY,JSON.stringify(library))}
  function current(){return externalCurriculum||library.curricula.find(c=>c.id===activeId)||null}
  function update(fn){const i=library.curricula.findIndex(c=>c.id===activeId);if(i<0)return;library.curricula[i]=fn(library.curricula[i]);library.curricula[i].updatedAt=new Date().toISOString();save();render()}
  function notify(text){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=text;document.body.append(n);setTimeout(()=>n.remove(),2400)}
  function theme(c){const p=palettes[c?.palette]||palettes['blue-gold'];return `--bg0:${p[1]};--bg1:${p[2]};--panel:${p[3]};--ink:${p[4]};--muted:${p[5]};--accent:${p[6]};--metal:${p[7]};--warm:${p[8]}`}
  function top(c){return `<header class="top"><button class="brand" data-home><span class="mark">CP</span><span><b>Curriculum Planner</b><small>HOLOGRAPHIC DEPLOYMENT CONSOLE</small></span></button><div class="actions">${c&&!readerOnly?`<button class="btn ghost ${mode==='build'?'on':''}" data-mode="build">Build</button><button class="btn ghost ${mode==='reader'?'on':''}" data-mode="reader">Reader preview</button>${mode==='build'&&selectedModule?'<button class="btn ghost" data-export-unit>Export unit JSON</button>':''}`:''}${readerOnly?'<span class="reader-only-note">READER DEPLOYMENT</span>':''}<button class="btn ghost hide-mobile" data-import>Import JSON</button>${!readerOnly?'<button class="btn primary" data-new>＋ New curriculum</button>':''}</div></header>`}
  function empty(){return `<main class="app" style="${theme()}">${top(null)}<section class="empty"><span class="eyebrow">PORTABLE CURRICULUM PUBLISHING</span><h1>Build the learning path.<br><em>Deploy the experience.</em></h1><p>Create modular curricula, connect Google materials, export portable source and reader JSON files, and publish a polished curriculum experience from one standalone page.</p><div class="actions"><button class="btn primary" data-new>Create your first curriculum</button><button class="btn ghost" data-import>Import source JSON</button></div></section></main>`}
  function libraryLanding(){return `<main class="app">${top(null)}<section class="library-stage"><div class="library-copy"><span class="eyebrow">CURRICULUM LIBRARY</span><h1>Curriculum<br><em>Builder</em></h1><p>Select a curriculum to project its modules, or begin a new learning path.</p><div class="actions"><button class="btn primary" data-new>＋ New curriculum</button><button class="btn ghost" data-import>Import JSON</button></div></div><div class="library-grid">${library.curricula.length?library.curricula.map((c,i)=>`<article class="holo-curriculum-card"><button data-open-curriculum="${c.id}"><span>CURRICULUM ${String(i+1).padStart(2,'0')}</span><h2>${esc(c.title)}</h2><p>${esc(c.subtitle||'A modular learning experience')}</p><small>${c.modules.length} modules · ${c.modules.reduce((n,m)=>n+m.lessons.length,0)} lessons</small></button><button class="delete-curriculum" data-delete-curriculum="${c.id}" title="Delete curriculum">×</button></article>`).join(''):`<button class="holo-curriculum-card empty-card" data-new><span>NO CURRICULA YET</span><h2>Create the first curriculum</h2></button>`}</div></section></main>`}
  function grouped(resources,editable,target,allowed=audiences.map(x=>x[0])){if(!resources?.length&&!editable)return '<p class="none">No resources linked yet.</p>';return audiences.filter(([aud])=>allowed.includes(aud)).map(([aud,label])=>{const boxes=types.map(type=>{const items=(resources||[]).filter(r=>r.audience===aud&&r.type===type);if(!items.length)return'';return `<div class="type-box" ${editable?`data-drop-type="${type}" data-drop-audience="${aud}"`:''}><header><span>${icons[type]}</span><b>${labels[type]}</b><small>${items.length}</small></header>${items.map(r=>editable?`<div class="resource-item" draggable="true" data-drag-resource="${r.id}" data-resource-type="${r.type}"><button data-edit-resource="${r.id}" data-target-kind="${target.kind}" data-target-id="${target.id}"><b>${esc(r.name)}</b><small>Drag to reorganize · click to edit</small></button><button class="remove" data-delete-resource="${r.id}">×</button></div>`:`<a href="${esc(r.url)}" target="_blank" rel="noopener"><div><b>${esc(r.name)}</b><small>${esc(r.description||labels[r.type])}</small></div><i>↗</i></a>`).join('')}</div>`}).join('');return `<section class="audience ${aud} ${boxes?'has-items':'is-empty'}" ${editable?`data-drop-audience="${aud}"`:''}><h4>${label}</h4>${boxes?`<div class="type-grid">${boxes}</div>`:'<div class="empty-drop">Empty · drop here</div>'}</section>`}).join('')}
  function resourceSection(title,resources,target){return `<section class="resource-section" data-target-kind="${target.kind}" data-target-id="${target.id}"><div class="resource-head"><span>${title}</span><button data-add-resource data-target-kind="${target.kind}" data-target-id="${target.id}">＋ Link Google resource</button></div>${grouped(resources,true,target)}</section>`}
  function readerResources(title,resources){return `<section class="reader-resources glass"><header><h2>${title}</h2></header><div class="resource-columns"><div class="resource-column student-col"><h3>Shared / Student Facing</h3>${grouped(resources,false,{},['student','both'])}</div><div class="resource-column teacher-col"><h3>Teacher Facing</h3>${grouped(resources,false,{},['teacher'])}</div></div></section>`}
  function side(c,reader=false){const lessons=c.modules.reduce((n,m)=>n+m.lessons.length,0),resources=c.modules.reduce((n,m)=>n+m.resources.length+m.lessons.reduce((x,l)=>x+l.resources.length,0),0);return `<aside class="side glass ${reader?'reader-nav':''}">${reader?`<button class="side-head reader-home-link" data-reader-home><span class="eyebrow">CURRICULUM READER</span><h3>${esc(c.title)}</h3></button>`:`<div class="side-head"><span class="eyebrow">CURRICULUM LIBRARY</span><select id="curriculumSelect">${library.curricula.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div>`}${!reader?`<div class="stats"><div><b>${c.modules.length}</b><span>Modules</span></div><div><b>${lessons}</b><span>Lessons</span></div><div><b>${resources}</b><span>Resources</span></div></div>`:''}<div class="structure-title"><span>STRUCTURE</span>${!reader?'<button data-add-module>＋ Module</button>':''}</div><div class="modules">${c.modules.map((m,i)=>`<button class="module-link ${m.id===selectedModule?'on':''}" data-module="${m.id}"><span>${String(i+1).padStart(2,'0')}</span><div><b>${esc(m.title)}</b><small>${m.lessons.length} lesson${m.lessons.length===1?'':'s'}</small></div></button>${reader&&m.id===selectedModule?m.lessons.map((l,li)=>`<button class="lesson-nav ${l.id===selectedLesson?'on':''}" data-lesson="${l.id}">${i+1}.${li+1} ${esc(l.title)}</button>`).join(''):''}`).join('')||'<p class="none">No modules yet.</p>'}</div>${!reader?'<div class="exports"><button data-export="source">⇩ Source JSON</button><button data-export="reader">⇩ Reader JSON</button></div>':''}</aside>`}
  function builder(c){let m=c.modules.find(x=>x.id===selectedModule)||c.modules[0]||null;if(m&&!selectedModule)selectedModule=m.id;let l=m?.lessons.find(x=>x.id===selectedLesson)||null;return `<main class="app" style="${theme(c)}">${top(c)}<div class="layout">${side(c)}<section class="workspace"><header class="curriculum-head glass"><div><span class="eyebrow">ACTIVE CURRICULUM</span><input class="title" id="curriculumTitle" value="${esc(c.title)}"><input class="subtitle" id="curriculumSubtitle" placeholder="Add a concise description" value="${esc(c.subtitle)}"></div><label><small>COLOR SYSTEM</small><select id="palette">${Object.entries(palettes).map(([k,v])=>`<option value="${k}" ${k===c.palette?'selected':''}>${v[0]}</option>`).join('')}</select></label></header>${!m?`<div class="module-editor glass none"><h2>Create your first module</h2><button class="btn primary" data-add-module>＋ Add module</button></div>`:`<article class="module-editor glass"><div class="module-top"><div class="module-num">${String(c.modules.indexOf(m)+1).padStart(2,'0')}</div><div><label>MODULE NAME<input id="moduleTitle" value="${esc(m.title)}"></label><label>MODULE DESCRIPTION<textarea id="moduleDescription" rows="2">${esc(m.description)}</textarea></label></div><div class="module-tools"><button data-move-module="-1">↑</button><button data-move-module="1">↓</button><button class="danger" data-delete-module>Delete</button></div></div><div class="essential"><label>ESSENTIAL QUESTION<input id="essential" value="${esc(m.essentialQuestion)}" placeholder="What question guides this module?"></label></div>${resourceSection('MODULE MATERIALS',m.resources,{kind:'module',id:m.id})}<div class="section-head"><div><span class="eyebrow">AUTOMATIC TABLE OF CONTENTS</span><h3>${m.lessons.length} lesson${m.lessons.length===1?'':'s'}</h3></div><button class="btn primary" data-add-lesson>＋ Add lesson</button></div><div class="lesson-list">${m.lessons.map((x,i)=>`<button class="lesson-card ${x.id===selectedLesson?'on':''}" data-lesson="${x.id}"><span>${String(i+1).padStart(2,'0')}</span><div><b>${esc(x.title)}</b><small>${esc(x.duration||'Duration not set')} · ${x.resources.length} resources</small></div></button>`).join('')||'<button class="lesson-card" data-add-lesson><span>＋</span><b>Add the first lesson</b></button>'}</div>${l?`<section class="lesson-edit"><div class="actions" style="justify-content:space-between"><span class="eyebrow">LESSON DETAILS</span><button class="btn ghost danger" data-delete-lesson>Delete lesson</button></div><label>LESSON TITLE<input id="lessonTitle" value="${esc(l.title)}"></label><div class="row"><label>DURATION<input id="lessonDuration" value="${esc(l.duration)}"></label><label>DESCRIPTION<input id="lessonDescription" value="${esc(l.description)}"></label></div><label>LEARNING OBJECTIVES<textarea id="objectives" rows="3">${esc(l.objectives)}</textarea></label>${resourceSection('LESSON MATERIALS',l.resources,{kind:'lesson',id:l.id})}</section>`:''}</article>`}</section></div></main>`}
  function curriculumHome(c){const lessons=c.modules.reduce((n,m)=>n+m.lessons.length,0),resources=c.modules.flatMap(m=>[...m.resources,...m.lessons.flatMap(l=>l.resources)]);return `<section class="home-stage glass"><div class="home-copy"><span class="eyebrow">HOLOGRAPHIC CURRICULUM DEPLOYMENT</span><h1>${esc(c.title)}</h1><p>${esc(c.subtitle||'A structured learning journey through modules, lessons, and carefully organized resources.')}</p><div class="home-stats"><div><b>${c.modules.length}</b><span>MODULES</span></div><div><b>${lessons}</b><span>LESSONS</span></div><div><b>${resources.length}</b><span>RESOURCES</span></div></div></div><div class="module-projection">${c.modules.length?c.modules.map((m,i)=>`<button class="photon-module" data-module="${m.id}"><span>MODULE ${String(i+1).padStart(2,'0')}</span><b>${esc(m.title)}</b><small>${m.lessons.length} lesson${m.lessons.length===1?'':'s'}</small></button>`).join(''):'<p class="none">Modules will illuminate here.</p>'}</div></section>`}
  function reader(c){let m=c.modules.find(x=>x.id===selectedModule)||null;let l=m?.lessons.find(x=>x.id===selectedLesson)||null;let stage='';if(!m)stage=curriculumHome(c);else if(l){const mi=c.modules.indexOf(m),li=m.lessons.indexOf(l);stage=`<button class="back" data-back>← Module contents</button><article class="reader-hero glass"><span class="eyebrow">MODULE ${mi+1} · LESSON ${li+1}</span><h1>${esc(l.title)}</h1><p>${esc(l.description||'Lesson materials and learning objectives')}</p></article>${l.objectives?`<section class="objectives glass"><span class="eyebrow">LEARNING OBJECTIVES</span><h2>By the end of this lesson</h2><ol>${l.objectives.split('\n').filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></section>`:''}${readerResources('Lesson materials',l.resources)}`}else{const mi=c.modules.indexOf(m);stage=`<article class="reader-hero glass"><span class="eyebrow">MODULE ${String(mi+1).padStart(2,'0')}</span><h1>${esc(m.title)}</h1><p>${esc(m.description||'Module overview')}</p>${m.essentialQuestion?`<div class="question"><span class="eyebrow">ESSENTIAL QUESTION</span>${esc(m.essentialQuestion)}</div>`:''}</article>${m.resources.length?readerResources('Module materials',m.resources):''}<section class="toc glass"><header><div><span class="eyebrow">TABLE OF CONTENTS</span><h2>Learning sequence</h2></div></header>${m.lessons.map((x,i)=>`<button class="toc-item" data-lesson="${x.id}"><span>${String(i+1).padStart(2,'0')}</span><div><h3>${esc(x.title)}</h3><p>${esc(x.description||'Open lesson details and materials')}</p></div><small>${esc(x.duration||'—')}</small></button>`).join('')||'<p class="none">Lessons will appear here as the curriculum is built.</p>'}</section>`}return `<main class="app" style="${theme(c)}">${top(c)}<div class="layout">${side(c,true)}<section class="workspace">${stage}</section></div></main>`}
  function render(){const c=current();app.innerHTML=!c?libraryLanding():(mode==='reader'||readerOnly?reader(c):builder(c));bind()}
  function bind(){document.querySelectorAll('[data-new]').forEach(x=>x.onclick=newCurriculum);document.querySelectorAll('[data-import]').forEach(x=>x.onclick=()=>fileInput.click());document.querySelector('[data-home]')?.addEventListener('click',()=>{if(mode==='reader'||readerOnly){selectedModule=selectedLesson=null}else mode='build';if(readerOnly)mode='reader';render()});document.querySelector('[data-reader-home]')?.addEventListener('click',()=>{selectedModule=selectedLesson=null;render()});document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{mode=x.dataset.mode;if(mode==='reader')selectedModule=selectedLesson=null;render()});document.querySelectorAll('[data-module]').forEach(x=>x.onclick=()=>{selectedModule=x.dataset.module;selectedLesson=x.dataset.openLesson||null;render()});document.querySelectorAll('[data-lesson]').forEach(x=>x.onclick=()=>{selectedLesson=x.dataset.lesson;render()});document.querySelector('[data-back]')?.addEventListener('click',()=>{selectedLesson=null;render()});document.querySelectorAll('[data-add-module]').forEach(x=>x.onclick=addModule);document.querySelectorAll('[data-add-lesson]').forEach(x=>x.onclick=addLesson);document.querySelectorAll('[data-add-resource]').forEach(x=>x.onclick=()=>resourceDialog(null,{kind:x.dataset.targetKind,id:x.dataset.targetId}));document.querySelectorAll('[data-edit-resource]').forEach(x=>x.onclick=()=>resourceDialog(findResource(x.dataset.editResource),{kind:x.dataset.targetKind,id:x.dataset.targetId}));document.querySelectorAll('[data-delete-resource]').forEach(x=>x.onclick=()=>deleteResource(x.dataset.deleteResource));document.querySelectorAll('[data-export]').forEach(x=>x.onclick=()=>exportJson(x.dataset.export));document.querySelector('[data-delete-module]')?.addEventListener('click',deleteModule);document.querySelector('[data-delete-lesson]')?.addEventListener('click',deleteLesson);document.querySelectorAll('[data-move-module]').forEach(x=>x.onclick=()=>moveModule(Number(x.dataset.moveModule)));bindDragDrop();const select=document.getElementById('curriculumSelect');if(select)select.onchange=()=>{activeId=select.value;selectedModule=selectedLesson=null;save();render()};bindValue('curriculumTitle',v=>update(c=>({...c,title:v})));bindValue('curriculumSubtitle',v=>update(c=>({...c,subtitle:v})));bindValue('palette',v=>update(c=>({...c,palette:v})));bindModule('moduleTitle','title');bindModule('moduleDescription','description');bindModule('essential','essentialQuestion');bindLesson('lessonTitle','title');bindLesson('lessonDuration','duration');bindLesson('lessonDescription','description');bindLesson('objectives','objectives')}
  function bindDragDrop(){document.querySelectorAll('[data-drag-resource]').forEach(x=>x.ondragstart=e=>{e.dataTransfer.setData('text/resource-id',x.dataset.dragResource);e.dataTransfer.setData('text/resource-type',x.dataset.resourceType);e.dataTransfer.effectAllowed='move'});document.querySelectorAll('[data-drop-audience],[data-drop-type]').forEach(x=>{x.ondragover=e=>{e.preventDefault();x.classList.add('drag-over')};x.ondragleave=()=>x.classList.remove('drag-over');x.ondrop=e=>{e.preventDefault();e.stopPropagation();x.classList.remove('drag-over');const rid=e.dataTransfer.getData('text/resource-id'),resource=findResource(rid),section=x.closest('.resource-section');if(!resource||!section)return;const moved={...resource,audience:x.dataset.dropAudience||resource.audience,type:x.dataset.dropType||e.dataTransfer.getData('text/resource-type')||resource.type};update(c=>placeResource(c,moved,{kind:section.dataset.targetKind,id:section.dataset.targetId}));notify('Resource reorganized')}})}
  function bindValue(el,fn){const x=document.getElementById(el);if(x)x.onchange=()=>fn(x.value)}
  function bindModule(el,key){bindValue(el,v=>update(c=>({...c,modules:c.modules.map(m=>m.id===selectedModule?{...m,[key]:v}:m)})))}
  function bindLesson(el,key){bindValue(el,v=>update(c=>({...c,modules:c.modules.map(m=>({...m,lessons:m.lessons.map(l=>l.id===selectedLesson?{...l,[key]:v}:l)}))})))}
  function show(title,subtitle,body,onSubmit,options={}){modal.innerHTML=`<header><div><span class="eyebrow">${subtitle}</span><h2>${title}</h2></div><button type="button" data-close>×</button></header><form class="form">${body}<div class="form-actions"><button type="button" class="btn ghost" data-close>Cancel</button>${options.addAnother?'<button type="button" class="btn ghost" data-add-another>Save and Add Another</button>':''}<button class="btn primary">Save</button></div></form>`;modal.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>modal.close());const form=modal.querySelector('form'),submit=addAnother=>onSubmit(new FormData(form),addAnother);form.onsubmit=e=>{e.preventDefault();submit(false)};form.onkeydown=e=>{if(e.key==='Enter'&&e.shiftKey){e.preventDefault();submit(true)}};modal.querySelector('[data-add-another]')?.addEventListener('click',()=>submit(true));modal.showModal()}
  function newCurriculum(){show('Create a curriculum','NEW DEPLOYMENT SOURCE',`<label>CURRICULUM NAME<input name="title" required autofocus></label><label>DESCRIPTION<input name="subtitle"></label><label>COLOR SYSTEM<select name="palette">${Object.entries(palettes).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select></label>`,f=>{const now=new Date().toISOString(),c={schemaVersion:1,id:id('curriculum'),title:f.get('title').trim(),subtitle:f.get('subtitle').trim(),author:'',palette:f.get('palette'),createdAt:now,updatedAt:now,modules:[]};library.curricula.push(c);activeId=c.id;selectedModule=selectedLesson=null;save();modal.close();render()})}
  function addModule(){show('Add module','EXTEND THE LEARNING PATH','<label>MODULE NAME<input name="title" required autofocus></label><label>DESCRIPTION<textarea name="description" rows="3"></textarea></label>',f=>{const m={id:id('module'),title:f.get('title').trim(),description:f.get('description').trim(),essentialQuestion:'',resources:[],lessons:[]};update(c=>({...c,modules:[...c.modules,m]}));selectedModule=m.id;modal.close();render()})}
  function addLesson(){if(!selectedModule)return;show('Add lesson','BUILD THE SEQUENCE','<label>LESSON TITLE<input name="title" required autofocus></label><label>DURATION<input name="duration" placeholder="e.g. 55 minutes"></label>',f=>{const l={id:id('lesson'),title:f.get('title').trim(),description:'',duration:f.get('duration').trim(),objectives:'',resources:[]};update(c=>({...c,modules:c.modules.map(m=>m.id===selectedModule?{...m,lessons:[...m.lessons,l]}:m)}));selectedLesson=l.id;modal.close();render()})}
  function placements(c,selected){return c.modules.map((m,mi)=>`<optgroup label="Module ${mi+1}: ${esc(m.title)}"><option value="module:${m.id}" ${selected===`module:${m.id}`?'selected':''}>Module materials</option>${m.lessons.map((l,li)=>`<option value="lesson:${l.id}" ${selected===`lesson:${l.id}`?'selected':''}>Lesson ${mi+1}.${li+1}: ${esc(l.title)}</option>`).join('')}</optgroup>`).join('')}
  function resourceDialog(r,target){show(r?'Edit or move resource':'Link a Google resource',r?'RESOURCE MANAGEMENT':'EXTERNAL MATERIAL',`<label>DISPLAY NAME<input name="name" required autofocus value="${esc(r?.name||'')}"></label><label>GOOGLE DRIVE URL<input name="url" type="url" required value="${esc(r?.url||'')}"></label><div class="row"><label>RESOURCE TYPE<select name="type">${types.map(t=>`<option value="${t}" ${r?.type===t?'selected':''}>${labels[t]}</option>`).join('')}</select></label><label>AUDIENCE<select name="audience"><option value="student" ${r?.audience==='student'?'selected':''}>Student-facing</option><option value="both" ${!r||r.audience==='both'?'selected':''}>Teacher and student</option><option value="teacher" ${r?.audience==='teacher'?'selected':''}>Teacher-facing</option></select></label></div><label>PLACEMENT<select name="placement">${placements(current(),`${target.kind}:${target.id}`)}</select><small>Move resources between modules and lessons here.</small></label><label>DESCRIPTION<input name="description" value="${esc(r?.description||'')}"></label>`,(f,addAnother)=>{const [kind,targetId]=f.get('placement').split(':'),resource={id:r?.id||id('resource'),name:f.get('name').trim(),url:f.get('url').trim(),type:f.get('type'),audience:f.get('audience'),description:f.get('description').trim()};update(c=>placeResource(c,resource,{kind,id:targetId}));notify(r?'Resource updated':'Resource linked');if(addAnother&&!r){modal.querySelector('[name=name]').value='';modal.querySelector('[name=url]').value='';modal.querySelector('[name=description]').value='';modal.querySelector('[name=name]').focus()}else modal.close()},{addAnother:!r})}
  function placeResource(c,r,t){let modules=c.modules.map(m=>({...m,resources:m.resources.filter(x=>x.id!==r.id),lessons:m.lessons.map(l=>({...l,resources:l.resources.filter(x=>x.id!==r.id)}))}));modules=modules.map(m=>t.kind==='module'&&m.id===t.id?{...m,resources:[...m.resources,r]}:{...m,lessons:m.lessons.map(l=>t.kind==='lesson'&&l.id===t.id?{...l,resources:[...l.resources,r]}:l)});return{...c,modules}}
  function findResource(rid){for(const m of current().modules){const a=m.resources.find(r=>r.id===rid);if(a)return a;for(const l of m.lessons){const b=l.resources.find(r=>r.id===rid);if(b)return b}}}
  function deleteResource(rid){if(!confirm('Remove this resource link?'))return;update(c=>({...c,modules:c.modules.map(m=>({...m,resources:m.resources.filter(r=>r.id!==rid),lessons:m.lessons.map(l=>({...l,resources:l.resources.filter(r=>r.id!==rid)}))}))}))}
  function deleteModule(){if(!confirm('Delete this module and all of its lessons?'))return;update(c=>({...c,modules:c.modules.filter(m=>m.id!==selectedModule)}));selectedModule=selectedLesson=null;render()}
  function deleteLesson(){if(!confirm('Delete this lesson and its resource links?'))return;update(c=>({...c,modules:c.modules.map(m=>({...m,lessons:m.lessons.filter(l=>l.id!==selectedLesson)}))}));selectedLesson=null;render()}
  function moveModule(delta){update(c=>{const a=[...c.modules],i=a.findIndex(m=>m.id===selectedModule),j=i+delta;if(j<0||j>=a.length)return c;[a[i],a[j]]=[a[j],a[i]];return{...c,modules:a}})}
  function exportJson(kind){const c=current(),slug=c.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'curriculum',payload=kind==='source'?{format:'curriculum-builder-source',exportKind:'developer-source',...c}:{format:'curriculum-builder-reader',schemaVersion:1,exportKind:'reader-deployment',curriculum:c};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download=`${slug}-${kind}.json`;a.click();URL.revokeObjectURL(a.href);notify(kind==='source'?'Source JSON exported':'Reader JSON exported')}
  function exportUnit(){const c=current(),m=c?.modules.find(module=>module.id===selectedModule);if(!c||!m)return;const unit={...c,id:`${c.id}-${m.id}`,title:`${c.title} — ${m.title}`,modules:[m]},slug=unit.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'unit',payload={format:'curriculum-builder-reader',schemaVersion:1,exportKind:'unit-reader-deployment',curriculum:unit};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download=`${slug}-reader.json`;a.click();URL.revokeObjectURL(a.href);notify('Unit reader JSON exported')}
  app.addEventListener('click',event=>{const target=event.target.closest('button');if(!target)return;if(target.matches('[data-home]')&&!readerOnly){event.preventDefault();event.stopImmediatePropagation();activeId=null;selectedModule=selectedLesson=null;mode='build';save();render();return}if(target.dataset.openCurriculum){activeId=target.dataset.openCurriculum;selectedModule=selectedLesson=null;mode='reader';save();render();return}if(target.dataset.deleteCurriculum){event.preventDefault();event.stopPropagation();const curriculum=library.curricula.find(c=>c.id===target.dataset.deleteCurriculum);if(curriculum&&confirm(`Delete “${curriculum.title}” from this browser?`)){library.curricula=library.curricula.filter(c=>c.id!==curriculum.id);if(activeId===curriculum.id)activeId=null;save();render();notify('Curriculum deleted')}return}if(target.matches('[data-export-unit]'))exportUnit()},true);
  fileInput.onchange=()=>{const file=fileInput.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const raw=JSON.parse(reader.result);if(raw.format==='curriculum-builder-reader'){externalCurriculum=raw.curriculum;readerOnly=true;mode='reader';selectedModule=selectedLesson=null}else if(['curriculum-builder-source','curriculum-forge'].includes(raw.format)){library.curricula=library.curricula.filter(c=>c.id!==raw.id);library.curricula.push(raw);activeId=raw.id;externalCurriculum=null;readerOnly=false;mode='build';save()}else throw 0;render();notify('JSON loaded')}catch{alert('That is not a valid Curriculum Builder JSON file.')}fileInput.value=''};reader.readAsText(file)};
  async function loadHosted(){const src=new URLSearchParams(location.search).get('curriculum');if(!src)return false;try{const res=await fetch(src);if(!res.ok)throw 0;const raw=await res.json();externalCurriculum=raw.format==='curriculum-builder-reader'?raw.curriculum:raw;readerOnly=true;mode='reader';return true}catch{alert('The hosted curriculum JSON could not be loaded.');return false}}
  loadHosted().finally(render);
})();
</script>
