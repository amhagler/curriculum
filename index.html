e .copy-summary b{font-size:11px}.builder-mode .copy-summary span{font-size:11px}.builder-active dialog label{font-size:11px;line-height:1.35}.builder-active dialog input,.builder-active dialog select,.builder-active dialog textarea{font-size:13px;line-height:1.4}.builder-active dialog .btn{font-size:10.5px}.builder-active dialog .eyebrow{font-size:10px}.builder-active dialog .bulk-help{font-size:12px}.builder-active dialog .bulk-labels{font-size:9px}@media(max-width:800px){.builder-mode .btn{font-size:10px}.builder-mode .resource-head>div:last-child{width:100%}}

<body>
<div id="app"></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<dialog id="modal"></dialog>
<script>
(()=>{
  const KEY='curriculum-builder-standalone-v1';
  const palettes={
    'blue-gold':['Antique Blue — DARK (Midnight Blue, Ivory, Antique Gold)','#050b18','#0a1d38','#102a4a','#f7f5ed','#aebed4','#74c7ff','#236fc3','#b9974f'],
    'blue-gold-light':['Antique Blue — LIGHT (Porcelain, Navy, Antique Gold)','#f4f1e8','#e5edf5','#f9fbfd','#10213b','#53657a','#0b6cae','#174f89','#8c681d'],
    'midnight-silver':['Lunar Silver — DARK (Midnight, Cyan, Silver)','#050910','#101b2b','#17283a','#f1f6fb','#aab9c8','#8de8ff','#4387a9','#c2cbd4'],
    'midnight-silver-light':['Lunar Silver — LIGHT (Frost, Slate, Cyan)','#f2f7fa','#dfeaf0','#f9fcfd','#17283a','#526575','#087c9d','#326a83','#71808b'],
    'forest-gold':['Verdant Archive — DARK (Deep Forest, Parchment, Gold)','#07100d','#10271f','#18362b','#f5f0df','#b9c2ad','#9ed8ba','#427b60','#c7a657'],
    'forest-gold-light':['Verdant Archive — LIGHT (Parchment, Forest Green, Gold)','#f4f0df','#e3eadc','#faf8ed','#173a2d','#5f6d60','#287355','#315f49','#927321'],
    'plum-rose':['Orchid Rose — DARK (Plum, Ivory, Rose Gold)','#100812','#29142f','#38203e','#fbf1ec','#cab6c9','#e7b8df','#8f568f','#c99079'],
    'plum-rose-light':['Orchid Rose — LIGHT (Blush Ivory, Plum, Rose Gold)','#fbf2f1','#f0e1eb','#fffaf8','#422344','#755d70','#9e467f','#713b72','#9d5c50'],
    'burgundy-brass':['Burgundy Brass — DARK (Burgundy, Cream, Brass)','#12090a','#32161a','#452127','#f8efe1','#cdb8ae','#efb6a1','#914852','#c09a55'],
    'burgundy-brass-light':['Burgundy Brass — LIGHT (Warm Cream, Burgundy, Brass)','#f8f0e2','#eee0d2','#fffaf1','#4a2024','#795b58','#9e463f','#76343d','#8b681f'],
    'charcoal-copper':['Copper Slate — DARK (Charcoal, Ice, Copper)','#080a0c','#1b2229','#26313a','#eef6f8','#aebbc0','#b8ecf5','#5e8791','#c68658'],
    'charcoal-copper-light':['Copper Slate — LIGHT (Mist, Charcoal, Copper)','#eef3f4','#dfe7e9','#f8fbfb','#202b32','#596970','#397486','#496d76','#9a5834']
  };
  const types=['lesson-plan','slides','worksheet','reading','document','assessment','video','other'];
  const labels={'lesson-plan':'Lesson plans',slides:'Slide decks',worksheet:'Worksheets',reading:'Readings',document:'Documents',assessment:'Assessments',video:'Videos',other:'Other'};
  const icons={'lesson-plan':'☷',slides:'▣',worksheet:'✎',reading:'◫',document:'▤',assessment:'✓',video:'▶',other:'◇'};
  const audiences=[['student','Student-facing materials'],['both','Shared materials'],['teacher','Teacher-facing materials']];
  let library=load(),activeId=null,selectedModule=null,selectedLesson=null,mode='build',readerOnly=false,externalCurriculum=null,editFocus='module',readerAudience='teacher',readerLayoutOverride=null;
  const app=document.getElementById('app'),modal=document.getElementById('modal'),fileInput=document.getElementById('importFile');
  app.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.readerLayout){event.preventDefault();event.stopImmediatePropagation();readerLayoutOverride=button.dataset.readerLayout;render();return}if(button.matches('[data-back]')){event.preventDefault();event.stopImmediatePropagation();selectedLesson=null;render();return}const section=button.closest('.resource-section'),target=section?{kind:section.dataset.targetKind,id:section.dataset.targetId}:null;if(button.dataset.resourceLayout&&target){event.preventDefault();event.stopImmediatePropagation();setResourceLayout(target,button.dataset.resourceLayout);return}if(button.matches('[data-apply-layout]')&&target){event.preventDefault();event.stopImmediatePropagation();applyLayoutToModule(resourceOwner(target)?.resourceLayout||'category');return}if(button.matches('[data-reset-resource-order]')&&target){event.preventDefault();event.stopImmediatePropagation();resetResourceOrder(target)}},true);
  const id=p=>p+'_'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||{format:'curriculum-builder-library',version:1,activeId:null,curricula:[]}}catch{return{format:'curriculum-builder-library',version:1,activeId:null,curricula:[]}}}
  function save(){library.activeId=activeId;localStorage.setItem(KEY,JSON.stringify(library))}
  function current(){return externalCurriculum||library.curricula.find(c=>c.id===activeId)||null}
  function update(fn){const i=library.curricula.findIndex(c=>c.id===activeId);if(i<0)return;library.curricula[i]=fn(library.curricula[i]);library.curricula[i].updatedAt=new Date().toISOString();save();render()}
  function notify(text){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=text;document.body.append(n);setTimeout(()=>n.remove(),2400)}
  function theme(c){const p=palettes[c?.palette]||palettes['blue-gold'];return `--bg0:${p[1]};--bg1:${p[2]};--panel:${p[3]};--ink:${p[4]};--muted:${p[5]};--accent:${p[6]};--metal:${p[7]};--warm:${p[8]}`}
  function top(c){return `<header class="top"><button class="brand" data-home><span class="mark">CP</span><span><b>Curriculum Planner</b><small>HOLOGRAPHIC DEPLOYMENT CONSOLE</small></span></button><div class="actions">${c&&!readerOnly?`<button class="btn ghost ${mode==='build'?'on':''}" data-mode="build">Admin builder</button><button class="btn ghost ${mode==='reader'?'on':''}" data-mode="reader">Reader preview</button>`:''}${c&&(mode==='reader'||readerOnly)?`<span class="view-switch"><button class="btn ghost ${readerAudience==='student'?'on':''}" data-audience-mode="student">Student view</button>${!readerOnly||readerAudience==='teacher'?`<button class="btn ghost ${readerAudience==='teacher'?'on':''}" data-audience-mode="teacher">Teacher view</button>`:''}</span>`:''}${mode==='build'&&selectedModule&&!readerOnly?'<button class="btn ghost" data-export-unit="student">Student unit</button><button class="btn ghost" data-export-unit="teacher">Teacher unit</button>':''}${readerOnly?`<span class="reader-only-note">${readerAudience.toUpperCase()} READER DEPLOYMENT</span>`:''}<button class="btn ghost hide-mobile" data-import>Import JSON</button>${!readerOnly?'<button class="btn primary" data-new>＋ New curriculum</button>':''}</div></header>`}
  function empty(){return `<main class="app" style="${theme()}">${top(null)}<section class="empty"><span class="eyebrow">PORTABLE CURRICULUM PUBLISHING</span><h1>Build the learning path.<br><em>Deploy the experience.</em></h1><p>Create modular curricula, connect Google materials, export portable source and reader JSON files, and publish a polished curriculum experience from one standalone page.</p><div class="actions"><button class="btn primary" data-new>Create your first curriculum</button><button class="btn ghost" data-import>Import source JSON</button></div></section></main>`}
  function libraryLanding(){return `<main class="app">${top(null)}<section class="library-stage"><div class="library-copy"><span class="eyebrow">CURRICULUM LIBRARY</span><h1>Curriculum<br><em>Builder</em></h1><p>Select a curriculum to project its modules, or begin a new learning path.</p><div class="actions"><button class="btn primary" data-new>＋ New curriculum</button><button class="btn ghost" data-import>Import JSON</button></div></div><div class="library-grid">${library.curricula.length?library.curricula.map((c,i)=>`<article class="holo-curriculum-card"><button data-open-curriculum="${c.id}"><span>CURRICULUM ${String(i+1).padStart(2,'0')}</span><h2>${esc(c.title)}</h2><p>${esc(c.subtitle||'A modular learning experience')}</p><small>${c.modules.length} modules · ${c.modules.reduce((n,m)=>n+m.lessons.length,0)} lessons</small></button><button class="delete-curriculum" data-delete-curriculum="${c.id}" title="Delete curriculum">×</button></article>`).join(''):`<button class="holo-curriculum-card empty-card" data-new><span>NO CURRICULA YET</span><h2>Create the first curriculum</h2></button>`}</div></section></main>`}
  function resourceOwner(target){const c=current();if(target.kind==='module')return c?.modules.find(m=>m.id===target.id);for(const m of c?.modules||[]){const l=m.lessons.find(x=>x.id===target.id);if(l)return l}}
  function resourceItem(r,editable,target){return editable?`<div class="resource-item ${r.url?'':'needs-link'}" draggable="true" data-drag-resource="${r.id}" data-resource-type="${r.type}" data-drop-resource="${r.id}">${target.kind==='lesson'?`<label class="copy-check" title="Select for copying"><input type="checkbox" data-copy-select value="${r.id}"><span>✓</span></label>`:''}<button data-edit-resource="${r.id}" data-target-kind="${target.kind}" data-target-id="${target.id}"><b>${esc(r.name)}</b><small>${r.url?'Drag to reorder · click to edit':'LINK NEEDED · click to add URL'}</small></button><button class="remove" data-delete-resource="${r.id}">×</button></div>`:`${r.url?`<button class="viewer-resource" data-open-viewer="${r.id}"><div><b>${esc(r.name)}</b><small>${esc(r.description||labels[r.type])}</small></div><i>▣</i></button>`:''}`}
  function grouped(resources,editable,target,allowed=audiences.map(x=>x[0])){if(!resources?.length&&!editable)return '<p class="none">No resources linked yet.</p>';return audiences.filter(([aud])=>allowed.includes(aud)).map(([aud,label])=>{const boxes=types.map(type=>{const items=(resources||[]).filter(r=>r.audience===aud&&r.type===type);if(!items.length)return'';return `<div class="type-box" ${editable?`data-drop-type="${type}" data-drop-audience="${aud}"`:''}><header><span>${icons[type]}</span><b>${labels[type]}</b><small>${items.length}</small></header>${items.map(r=>resourceItem(r,editable,target)).join('')}</div>`}).join('');return `<section class="audience ${aud} ${boxes?'has-items':'is-empty'}" ${editable?`data-drop-audience="${aud}"`:''}><h4>${label}</h4>${boxes?`<div class="type-grid">${boxes}</div>`:'<div class="empty-drop">Empty · drop here</div>'}</section>`}).join('')}
  function manualResources(resources,editable,target,allowed=audiences.map(x=>x[0])){if(!resources?.length&&!editable)return'';return audiences.filter(([aud])=>allowed.includes(aud)).map(([aud,label])=>{const items=(resources||[]).filter(r=>r.audience===aud);if(!items.length&&!editable)return'';return `<section class="audience manual-audience ${aud}" ${editable?`data-drop-audience="${aud}"`:''}><h4>${label}</h4><div class="manual-list">${items.map(r=>`<div class="manual-wrap"><span class="type-chip">${icons[r.type]} ${labels[r.type]}</span>${resourceItem(r,editable,target)}</div>`).join('')||'<div class="empty-drop">Empty · drop here</div>'}</div></section>`}).join('')}
  function resourceSection(title,resources,target){const layout=resourceOwner(target)?.resourceLayout||'category';return `<section class="resource-section" data-target-kind="${target.kind}" data-target-id="${target.id}"><div class="resource-head"><span>${title}</span><div class="layout-toggle"><button class="${layout==='category'?'on':''}" data-resource-layout="category">Organize by category</button><button class="${layout==='manual'?'on':''}" data-resource-layout="manual">Arrange by order</button></div><div>${target.kind==='lesson'?'<button data-apply-layout title="Use this display mode for every lesson in the current module">Apply mode to module</button>':''}<button data-reset-resource-order title="Restore the standard student/shared/teacher and document-type sequence">Reset order</button>${target.kind==='lesson'&&resources.length?'<button data-copy-resources>⧉ Copy selected</button>':''}<button data-bulk-resource data-target-kind="${target.kind}" data-target-id="${target.id}">＋ Bulk add</button><button data-add-resource data-target-kind="${target.kind}" data-target-id="${target.id}">＋ Link Google resource</button></div></div>${layout==='manual'?manualResources(resources,true,target):grouped(resources,true,target)}</section>`}
  function visibleResources(resources){return (resources||[]).filter(r=>r.url&&(readerAudience==='teacher'||r.audience!=='teacher'))}
  function readerResources(title,resources,owner={}){resources=visibleResources(resources);if(!resources.length)return'';const student=resources.filter(r=>r.audience==='student'||r.audience==='both'),teacher=resources.filter(r=>r.audience==='teacher'),layout=readerLayoutOverride||owner.resourceLayout||'category',manual=layout==='manual';return `<section class="reader-resources glass"><header><h2>${title}</h2><div class="reader-layout-toggle" role="group" aria-label="Resource display"><span>VIEW AS</span><button class="${!manual?'on':''}" data-reader-layout="category">By category</button><button class="${manual?'on':''}" data-reader-layout="manual">In order</button></div></header><div class="resource-columns ${student.length&&teacher.length?'':'single-audience'}">${student.length?`<div class="resource-column student-col"><h3>Shared / Student Facing</h3>${manual?manualResources(student,false,{},['student','both']):grouped(student,false,{},['student','both'])}</div>`:''}${teacher.length?`<div class="resource-column teacher-col"><h3>Teacher Facing</h3>${manual?manualResources(teacher,false,{},['teacher']):grouped(teacher,false,{},['teacher'])}</div>`:''}</div></section>`}
  function side(c,reader=false){const lessons=c.modules.reduce((n,m)=>n+m.lessons.length,0),resources=c.modules.reduce((n,m)=>n+m.resources.length+m.lessons.reduce((x,l)=>x+l.resources.length,0),0);return `<aside class="side glass ${reader?'reader-nav':''}">${reader?`<button class="side-head reader-home-link" data-reader-home><span class="eyebrow">${readerAudience.toUpperCase()} CURRICULUM READER</span><h3>${esc(c.title)}</h3></button>`:`<div class="side-head"><span class="eyebrow">CURRICULUM LIBRARY</span><select id="curriculumSelect">${library.curricula.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div>`}${!reader?`<div class="stats"><div><b>${c.modules.length}</b><span>Modules</span></div><div><b>${lessons}</b><span>Lessons</span></div><div><b>${resources}</b><span>Resources</span></div></div>`:''}<div class="structure-title"><span>STRUCTURE</span>${!reader?'<button data-add-module>＋ Module</button>':''}</div><div class="modules">${c.modules.map((m,i)=>`<button class="module-link ${m.id===selectedModule?'on':''}" data-module="${m.id}"><span>${String(i+1).padStart(2,'0')}</span><div><b>${esc(m.title)}</b><small>${m.lessons.length} lesson${m.lessons.length===1?'':'s'}</small></div></button>${reader&&m.id===selectedModule?m.lessons.map((l,li)=>`<button class="lesson-nav ${l.id===selectedLesson?'on':''}" data-lesson="${l.id}">${i+1}.${li+1} ${esc(l.title)}</button>`).join(''):''}`).join('')||'<p class="none">No modules yet.</p>'}</div>${!reader?'<div class="exports three"><button data-export="admin">⇩ Admin</button><button data-export="student">⇩ Student</button><button data-export="teacher">⇩ Teacher</button></div>':''}</aside>`}

  function addLesson(){if(!selectedModule)return;show('Add lesson','BUILD THE SEQUENCE','<label>LESSON TITLE<input name="title" required autofocus></label><label>DURATION<input name="duration" placeholder="e.g. 55 minutes"></label>',f=>{const l={id:id('lesson'),title:f.get('title').trim(),description:'',duration:f.get('duration').trim(),objectives:'',resources:[]};update(c=>({...c,modules:c.modules.map(m=>m.id===selectedModule?{...m,lessons:[...m.lessons,l]}:m)}));selectedLesson=l.id;editFocus='lesson';modal.close();render()})}
  function placements(c,selected){return c.modules.map((m,mi)=>`<optgroup label="Module ${mi+1}: ${esc(m.title)}"><option value="module:${m.id}" ${selected===`module:${m.id}`?'selected':''}>Module materials</option>${m.lessons.map((l,li)=>`<option value="lesson:${l.id}" ${selected===`lesson:${l.id}`?'selected':''}>Lesson ${mi+1}.${li+1}: ${esc(l.title)}</option>`).join('')}</optgroup>`).join('')}
  function resourceDialog(r,target){show(r?'Edit or move resource':'Link a Google resource',r?'RESOURCE MANAGEMENT':'EXTERNAL MATERIAL',`<label>DISPLAY NAME<input name="name" required autofocus value="${esc(r?.name||'')}"></label><label>GOOGLE DRIVE URL<input name="url" type="url" required value="${esc(r?.url||'')}"></label><div class="row"><label>RESOURCE TYPE<select name="type">${types.map(t=>`<option value="${t}" ${r?.type===t?'selected':''}>${labels[t]}</option>`).join('')}</select></label><label>AUDIENCE<select name="audience"><option value="student" ${r?.audience==='student'?'selected':''}>Student-facing</option><option value="both" ${!r||r.audience==='both'?'selected':''}>Teacher and student</option><option value="teacher" ${r?.audience==='teacher'?'selected':''}>Teacher-facing</option></select></label></div><label>PLACEMENT<select name="placement">${placements(current(),`${target.kind}:${target.id}`)}</select><small>Move resources between modules and lessons here.</small></label><label>DESCRIPTION<input name="description" value="${esc(r?.description||'')}"></label>`,(f,addAnother)=>{const [kind,targetId]=f.get('placement').split(':'),resource={id:r?.id||id('resource'),name:f.get('name').trim(),url:f.get('url').trim(),type:f.get('type'),audience:f.get('audience'),description:f.get('description').trim()};update(c=>placeResource(c,resource,{kind,id:targetId}));notify(r?'Resource updated':'Resource linked');if(addAnother&&!r){modal.querySelector('[name=name]').value='';modal.querySelector('[name=url]').value='';modal.querySelector('[name=description]').value='';modal.querySelector('[name=name]').focus()}else modal.close()},{addAnother:!r})}
  function bulkRow(){return `<div class="bulk-row"><input name="bulkName" placeholder="Display name"><input name="bulkUrl" type="url" placeholder="https://drive.google.com/…"><select name="bulkType">${types.map(t=>`<option value="${t}">${labels[t]}</option>`).join('')}</select><select name="bulkAudience"><option value="student">Student</option><option value="both" selected>Shared</option><option value="teacher">Teacher</option></select><button type="button" data-remove-bulk aria-label="Remove row">×</button></div>`}
  function bindBulkRows(){const list=modal.querySelector('[data-bulk-list]');modal.querySelector('[data-add-bulk-row]').onclick=()=>{list.insertAdjacentHTML('beforeend',bulkRow());bindBulkRemove();const rows=list.querySelectorAll('.bulk-row');rows[rows.length-1].querySelector('input').focus()};bindBulkRemove()}
  function bindBulkRemove(){modal.querySelectorAll('[data-remove-bulk]').forEach(x=>x.onclick=()=>{const rows=modal.querySelectorAll('.bulk-row');if(rows.length>1)x.closest('.bulk-row').remove();else{x.closest('.bulk-row').querySelectorAll('input').forEach(i=>i.value='')}})}
  function bulkResourceDialog(target){show('Bulk add resources','RAPID RESOURCE ENTRY',`<p class="bulk-help">Add several links to this ${target.kind} in one pass. Blank rows are ignored.</p><div class="bulk-labels"><span>Name</span><span>Google Drive URL</span><span>Type</span><span>Audience</span><span></span></div><div class="bulk-list" data-bulk-list>${Array.from({length:4},bulkRow).join('')}</div><button class="btn ghost bulk-more" type="button" data-add-bulk-row>＋ Add another row</button>`,f=>{const names=f.getAll('bulkName'),urls=f.getAll('bulkUrl'),resourceTypes=f.getAll('bulkType'),audiences=f.getAll('bulkAudience');const additions=names.map((name,i)=>({id:id('resource'),name:String(name).trim(),url:String(urls[i]||'').trim(),type:resourceTypes[i]||'document',audience:audiences[i]||'both',description:''})).filter(r=>r.name&&r.url);if(!additions.length){notify('Enter at least one resource name and URL');return}update(c=>additions.reduce((next,r)=>placeResource(next,r,target),c));modal.close();notify(`${additions.length} resource${additions.length===1?'':'s'} added`) });bindBulkRows()}
  function copySelectedResources(){const selected=[...document.querySelectorAll('[data-copy-select]:checked')].map(x=>x.value),c=current(),source=c.modules.flatMap(m=>m.lessons).find(l=>l.id===selectedLesson),templates=(source?.resources||[]).filter(r=>selected.includes(r.id));if(!templates.length){notify('Select at least one resource first');return}const lessonOptions=c.modules.map((m,mi)=>`<optgroup label="Module ${mi+1}: ${esc(m.title)}">${m.lessons.filter(l=>l.id!==source.id).map((l,li)=>`<option value="${l.id}">${mi+1}.${li+1} ${esc(l.title)}</option>`).join('')}</optgroup>`).join(''),moduleOptions=c.modules.map((m,mi)=>`<option value="${m.id}" ${m.id===selectedModule?'selected':''}>Module ${mi+1}: ${esc(m.title)}</option>`).join('');show('Copy resource structure','LESSON TEMPLATE WORKFLOW',`<div class="copy-summary"><b>${templates.length} resource template${templates.length===1?'':'s'} selected</b>${templates.map(r=>`<span>${icons[r.type]} ${esc(r.name)}</span>`).join('')}</div><label>DESTINATION<select name="copyMode"><option value="existing">Existing lesson</option><option value="new-current">New lesson in current module</option><option value="new-existing">New lesson in another existing module</option><option value="new-module">New module and lesson</option></select></label><label>EXISTING LESSON<select name="existingLesson">${lessonOptions}</select></label><label>DESTINATION MODULE<select name="moduleId">${moduleOptions}</select></label><div class="row"><label>NEW LESSON NAME<input name="lessonTitle" placeholder="Required when creating a lesson"></label><label>DURATION<input name="lessonDuration" placeholder="e.g. 55 minutes"></label></div><label>NEW MODULE NAME<input name="moduleTitle" placeholder="Required only for a new module"></label><label>DUPLICATE NAMES<select name="duplicates"><option value="skip">Skip matching names</option><option value="create">Create another copy</option></select></label><p class="bulk-help">Names, types, audiences, descriptions, and order will copy. URLs will remain blank and will never appear in Reader view until linked.</p>`,f=>{const modeChoice=f.get('copyMode'),lessonTitle=String(f.get('lessonTitle')||'').trim(),moduleTitle=String(f.get('moduleTitle')||'').trim();if(modeChoice!=='existing'&&!lessonTitle){notify('Enter a name for the new lesson');return}if(modeChoice==='new-module'&&!moduleTitle){notify('Enter a name for the new module');return}let destinationLesson=String(f.get('existingLesson')||''),destinationModule=String(f.get('moduleId')||selectedModule),copied=0;update(curriculum=>{let modules=curriculum.modules.map(m=>({...m,lessons:m.lessons.map(l=>({...l,resources:[...l.resources]}))}));if(modeChoice==='new-module'){destinationModule=id('module');destinationLesson=id('lesson');modules.push({id:destinationModule,title:moduleTitle,description:'',essentialQuestion:'',resources:[],lessons:[{id:destinationLesson,title:lessonTitle,description:'',duration:String(f.get('lessonDuration')||'').trim(),objectives:'',resources:[]}]})}else if(modeChoice==='new-current'||modeChoice==='new-existing'){destinationModule=modeChoice==='new-current'?selectedModule:destinationModule;destinationLesson=id('lesson');modules=modules.map(m=>m.id===destinationModule?{...m,lessons:[...m.lessons,{id:destinationLesson,title:lessonTitle,description:'',duration:String(f.get('lessonDuration')||'').trim(),objectives:'',resources:[]}]}:m)}else{const parent=modules.find(m=>m.lessons.some(l=>l.id===destinationLesson));destinationModule=parent?.id||selectedModule}modules=modules.map(m=>({...m,lessons:m.lessons.map(l=>{if(l.id!==destinationLesson)return l;const existingNames=new Set(l.resources.map(r=>r.name.trim().toLowerCase())),copies=templates.filter(r=>f.get('duplicates')==='create'||!existingNames.has(r.name.trim().toLowerCase())).map(r=>({...r,id:id('resource'),url:''}));copied=copies.length;return{...l,resources:[...l.resources,...copies]}})}));selectedModule=destinationModule;selectedLesson=destinationLesson;editFocus='lesson';return{...curriculum,modules}});modal.close();notify(`${copied} template${copied===1?'':'s'} copied · links needed`)})}
  function reorderResource(c,r,t,beforeId=null){let modules=c.modules.map(m=>({...m,resources:m.resources.filter(x=>x.id!==r.id),lessons:m.lessons.map(l=>({...l,resources:l.resources.filter(x=>x.id!==r.id)}))}));const insert=list=>{const next=[...list],at=beforeId?next.findIndex(x=>x.id===beforeId):-1;next.splice(at<0?next.length:at,0,r);return next};modules=modules.map(m=>t.kind==='module'&&m.id===t.id?{...m,resources:insert(m.resources)}:{...m,lessons:m.lessons.map(l=>t.kind==='lesson'&&l.id===t.id?{...l,resources:insert(l.resources)}:l)});return{...c,modules}}
  function placeResource(c,r,t){return reorderResource(c,r,t)}
  function setResourceLayout(target,layout){update(c=>({...c,modules:c.modules.map(m=>target.kind==='module'&&m.id===target.id?{...m,resourceLayout:layout}:{...m,lessons:m.lessons.map(l=>target.kind==='lesson'&&l.id===target.id?{...l,resourceLayout:layout}:l)})}))}
  function applyLayoutToModule(layout){update(c=>({...c,modules:c.modules.map(m=>m.id===selectedModule?{...m,lessons:m.lessons.map(l=>({...l,resourceLayout:layout}))}:m)}));notify('Display mode applied to every lesson in this module')}
  function resetResourceOrder(target){const audienceOrder=['student','both','teacher'],sort=list=>list.map((r,i)=>({r,i})).sort((a,b)=>audienceOrder.indexOf(a.r.audience)-audienceOrder.indexOf(b.r.audience)||types.indexOf(a.r.type)-types.indexOf(b.r.type)||a.i-b.i).map(x=>x.r);update(c=>({...c,modules:c.modules.map(m=>target.kind==='module'&&m.id===target.id?{...m,resources:sort(m.resources)}:{...m,lessons:m.lessons.map(l=>target.kind==='lesson'&&l.id===target.id?{...l,resources:sort(l.resources)}:l)})}));notify('Resource order reset')}
  function findResource(rid){for(const m of current().modules){const a=m.resources.find(r=>r.id===rid);if(a)return a;for(const l of m.lessons){const b=l.resources.find(r=>r.id===rid);if(b)return b}}}
  function deleteResource(rid){if(!confirm('Remove this resource link?'))return;update(c=>({...c,modules:c.modules.map(m=>({...m,resources:m.resources.filter(r=>r.id!==rid),lessons:m.lessons.map(l=>({...l,resources:l.resources.filter(r=>r.id!==rid)}))}))}))}
  function deleteModule(){if(!confirm('Delete this module and all of its lessons?'))return;update(c=>({...c,modules:c.modules.filter(m=>m.id!==selectedModule)}));selectedModule=selectedLesson=null;render()}
  function deleteLesson(){if(!confirm('Delete this lesson and its resource links?'))return;update(c=>({...c,modules:c.modules.map(m=>({...m,lessons:m.lessons.filter(l=>l.id!==selectedLesson)}))}));selectedLesson=null;render()}
  function moveModule(delta){update(c=>{const a=[...c.modules],i=a.findIndex(m=>m.id===selectedModule),j=i+delta;if(j<0||j>=a.length)return c;[a[i],a[j]]=[a[j],a[i]];return{...c,modules:a}})}
  function curriculumForAudience(c,audience){const copy=structuredClone(c);if(audience==='student')copy.modules=copy.modules.map(m=>({...m,resources:m.resources.filter(r=>r.audience!=='teacher'),lessons:m.lessons.map(l=>({...l,resources:l.resources.filter(r=>r.audience!=='teacher')}))}));return copy}
  function downloadJson(payload,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
  function exportJson(kind){const c=current(),slug=c.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'curriculum';if(kind==='admin'){downloadJson({format:'curriculum-builder-source',schemaVersion:2,exportKind:'admin-builder-source',...c},`${slug}-admin.json`);notify('Admin builder JSON exported');return}const audience=kind==='student'?'student':'teacher',payload={format:'curriculum-builder-reader',schemaVersion:2,exportKind:`${audience}-reader-deployment`,audienceMode:audience,curriculum:curriculumForAudience(c,audience)};downloadJson(payload,`${slug}-${audience}-reader.json`);notify(`${audience[0].toUpperCase()+audience.slice(1)} reader JSON exported`)}
  function exportUnit(audience='teacher'){const c=current(),m=c?.modules.find(module=>module.id===selectedModule);if(!c||!m)return;const unit=curriculumForAudience({...c,id:`${c.id}-${m.id}`,title:`${c.title} — ${m.title}`,modules:[m]},audience),slug=unit.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'unit',payload={format:'curriculum-builder-reader',schemaVersion:2,exportKind:`${audience}-unit-reader-deployment`,audienceMode:audience,curriculum:unit};downloadJson(payload,`${slug}-${audience}-unit-reader.json`);notify(`${audience[0].toUpperCase()+audience.slice(1)} unit reader JSON exported`)}
  app.addEventListener('click',event=>{const target=event.target.closest('button');if(!target)return;if(target.dataset.audienceMode){readerAudience=target.dataset.audienceMode;render();return}if(target.dataset.openViewer){openResourceViewer(target.dataset.openViewer);return}if(target.matches('[data-home]')&&!readerOnly){event.preventDefault();event.stopImmediatePropagation();activeId=null;selectedModule=selectedLesson=null;mode='build';save();render();return}if(target.dataset.openCurriculum){activeId=target.dataset.openCurriculum;selectedModule=selectedLesson=null;mode='reader';readerAudience='teacher';save();render();return}if(target.dataset.deleteCurriculum){event.preventDefault();event.stopPropagation();const curriculum=library.curricula.find(c=>c.id===target.dataset.deleteCurriculum);if(curriculum&&confirm(`Delete “${curriculum.title}” from this browser?`)){library.curricula=library.curricula.filter(c=>c.id!==curriculum.id);if(activeId===curriculum.id)activeId=null;save();render();notify('Curriculum deleted')}return}if(target.matches('[data-export-unit]'))exportUnit(target.dataset.exportUnit||'teacher')},true);
  fileInput.onchange=()=>{const file=fileInput.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const raw=JSON.parse(reader.result);if(raw.format==='curriculum-builder-reader'){externalCurriculum=raw.curriculum;readerOnly=true;readerAudience=raw.audienceMode||'teacher';mode='reader';selectedModule=selectedLesson=null}else if(['curriculum-builder-source','curriculum-forge'].includes(raw.format)){library.curricula=library.curricula.filter(c=>c.id!==raw.id);library.curricula.push(raw);activeId=raw.id;externalCurriculum=null;readerOnly=false;readerAudience='teacher';mode='build';save()}else throw 0;render();notify('JSON loaded')}catch{alert('That is not a valid Curriculum Builder JSON file.')}fileInput.value=''};reader.readAsText(file)};
  async function loadHosted(){const src=new URLSearchParams(location.search).get('curriculum');if(!src)return false;try{const res=await fetch(src);if(!res.ok)throw 0;const raw=await res.json();externalCurriculum=raw.format==='curriculum-builder-reader'?raw.curriculum:raw;readerAudience=raw.audienceMode||'teacher';readerOnly=true;mode='reader';return true}catch{alert('The hosted curriculum JSON could not be loaded.');return false}}
  loadHosted().finally(render);
})();
