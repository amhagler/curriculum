<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A portable holographic curriculum builder for modules, lessons, and Google Drive resources.">
  <title>Curriculum Builder</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050b18}button,input,select,textarea{font:inherit}button{cursor:pointer}:root{--sans:Arial,Helvetica,sans-serif;--serif:Georgia,serif;--mono:ui-monospace,Consolas,monospace}.app{--bg0:#050b18;--bg1:#0a1d38;--panel:#102a4a;--ink:#f7f5ed;--muted:#aebed4;--accent:#74c7ff;--metal:#236fc3;--warm:#b9974f;min-height:100vh;color:var(--ink);font-family:var(--sans);background:radial-gradient(900px 620px at 10% 0%,color-mix(in srgb,var(--metal) 24%,transparent),transparent 64%),radial-gradient(700px 460px at 92% 10%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 68%),linear-gradient(155deg,var(--bg0),var(--bg1));overflow-x:hidden}.app:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(to bottom,#000,transparent 78%)}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:13px clamp(16px,3vw,42px);border-bottom:1px solid #ffffff1a;background:color-mix(in srgb,var(--bg0) 84%,transparent);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--ink);text-align:left}.mark{display:grid;place-items:center;width:40px;height:40px;border:1px solid color-mix(in srgb,var(--accent) 42%,transparent);border-radius:13px;color:var(--accent);font:900 10px var(--mono);box-shadow:0 0 20px color-mix(in srgb,var(--accent) 18%,transparent)}.brand b{display:block;font:600 17px var(--serif)}.brand small,.eyebrow{display:block;color:var(--accent);font:900 8px var(--mono);letter-spacing:.15em}.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:9px 11px;font:800 9px var(--mono);white-space:nowrap}.primary{color:var(--bg0);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 92%,white),color-mix(in srgb,var(--metal) 76%,var(--accent)));box-shadow:0 8px 22px #0005,0 0 18px color-mix(in srgb,var(--accent) 18%,transparent)}.ghost{color:var(--ink);border:1px solid #ffffff20;background:#ffffff0a}.ghost.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 34%,transparent)}.glass{border:1px solid #ffffff1b;background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 76%,transparent),color-mix(in srgb,var(--bg1) 68%,transparent));box-shadow:0 18px 55px #0005;backdrop-filter:blur(12px)}.empty{position:relative;z-index:1;min-height:calc(100vh - 70px);display:grid;place-content:center;justify-items:start;padding:8vw}.empty h1{max-width:850px;margin:14px 0;font:500 clamp(48px,7vw,88px)/.98 var(--serif);letter-spacing:-.045em}.empty h1 em{color:var(--warm);font-weight:400}.empty p{max-width:680px;color:var(--muted);font-size:16px;line-height:1.7}.empty .actions{margin-top:20px}.layout{position:relative;z-index:1;max-width:1600px;margin:auto;display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;padding:15px}.side{position:sticky;top:85px;height:calc(100vh - 100px);border-radius:21px;display:flex;flex-direction:column;overflow:hidden}.side-head{padding:15px;border-bottom:1px solid #ffffff16}.side select{width:100%;margin-top:9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:12px;border:1px solid #ffffff14;border-radius:13px;overflow:hidden}.stats div{padding:10px 3px;text-align:center;border-right:1px solid #ffffff12}.stats div:last-child{border:0}.stats b{display:block;color:var(--accent);font:900 16px var(--mono)}.stats span{color:var(--muted);font:7px var(--mono);text-transform:uppercase}.structure-title{display:flex;justify-content:space-between;padding:10px 13px;border-block:1px solid #ffffff13;color:var(--muted);font:900 8px var(--mono);letter-spacing:.1em}.structure-title button{border:0;background:none;color:var(--accent);font:800 8px var(--mono)}.modules{flex:1;overflow:auto}.module-link{width:100%;display:grid;grid-template-columns:27px 1fr;gap:8px;padding:12px;border:0;border-bottom:1px solid #ffffff0e;background:transparent;color:var(--ink);text-align:left}.module-link.on{background:color-mix(in srgb,var(--accent) 9%,transparent);box-shadow:3px 0 var(--accent) inset}.module-link>span{color:var(--warm);font:900 8px var(--mono)}.module-link b,.module-link small{display:block}.module-link b{font-size:11px}.module-link small{margin-top:3px;color:var(--muted);font:8px var(--mono)}.exports{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #ffffff16}.exports button{padding:12px 4px;border:0;border-right:1px solid #ffffff12;background:#ffffff07;color:var(--accent);font:800 8px var(--mono)}.workspace{display:grid;align-content:start;gap:13px}.curriculum-head,.module-editor,.reader-hero,.toc,.reader-resources{border-radius:21px;overflow:hidden}.curriculum-head{display:flex;justify-content:space-between;gap:18px;padding:18px 20px}.curriculum-head>div{flex:1}.curriculum-head input{display:block;width:100%;border:0;background:none;padding:2px;color:var(--ink)}.curriculum-head .title{font:600 28px var(--serif)}.curriculum-head .subtitle{color:var(--muted);font-size:11px}.curriculum-head label{width:250px}.curriculum-head label small{display:block;margin-bottom:5px;color:var(--muted);font:800 8px var(--mono)}input,select,textarea{border:1px solid #ffffff20;border-radius:10px;background:color-mix(in srgb,var(--bg0) 72%,transparent);color:var(--ink);padding:9px 10px;outline:0;color-scheme:dark}.module-top{display:grid;grid-template-columns:58px 1fr auto;gap:15px;padding:19px;border-bottom:1px solid #ffffff16}.module-num{display:grid;place-items:center;width:58px;height:58px;border:1px solid color-mix(in srgb,var(--warm) 34%,transparent);border-radius:18px;color:var(--warm);font:600 22px var(--serif)}label{display:grid;gap:5px;color:var(--muted);font:900 8px var(--mono);letter-spacing:.09em}.module-top label+label{margin-top:9px}.module-top input,.module-top textarea,.lesson-edit input,.lesson-edit textarea{width:100%}.module-tools{display:flex;gap:5px;align-items:start}.module-tools button{border:1px solid #ffffff18;border-radius:8px;background:#ffffff07;color:var(--muted);padding:7px}.danger{color:#f2a0a0!important}.essential{padding:13px 19px;border-bottom:1px solid #ffffff12}.essential input{width:100%}.section-head{display:flex;justify-content:space-between;align-items:center;padding:16px 19px}.section-head h3{margin:4px 0 0;font:500 21px var(--serif)}.lesson-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;padding:0 19px 18px}.lesson-card{display:grid;grid-template-columns:28px 1fr;gap:8px;min-height:74px;padding:12px;border:1px solid #ffffff16;border-radius:12px;background:#ffffff06;color:var(--ink);text-align:left}.lesson-card.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}.lesson-card>span{color:var(--warm);font:900 9px var(--mono)}.lesson-card b,.lesson-card small{display:block}.lesson-card small{margin-top:5px;color:var(--muted);font:8px var(--mono)}.lesson-edit{margin:0 19px 19px;padding:16px;border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);border-radius:15px;background:#0002}.lesson-edit .row{display:grid;grid-template-columns:1fr 2fr;gap:9px}.lesson-edit label{margin-bottom:10px}.resource-section{padding:15px 19px;border-top:1px solid #ffffff12}.resource-head{display:flex;justify-content:space-between;color:var(--muted);font:900 8px var(--mono);letter-spacing:.11em}.resource-head button{border:0;background:none;color:var(--accent);font:800 8px var(--mono)}.audience{margin-top:13px}.audience>h4{margin:0 0 7px;color:var(--muted);font:900 8px var(--mono);letter-spacing:.11em;text-transform:uppercase}.audience.student>h4{color:var(--accent)}.audience.teacher{padding-top:11px;border-top:1px solid color-mix(in srgb,var(--warm) 20%,transparent)}.audience.teacher>h4{color:var(--warm)}.type-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px}.type-box{overflow:hidden;border:1px solid #ffffff18;border-radius:11px;background:#ffffff05}.type-box header{display:grid;grid-template-columns:22px 1fr auto;align-items:center;padding:8px 9px;border-bottom:1px solid #ffffff12;font:800 8px var(--mono);text-transform:uppercase}.type-box header span{color:var(--accent)}.resource-item{display:grid;grid-template-columns:1fr 27px;border-bottom:1px solid #ffffff0d}.resource-item:last-child{border:0}.resource-item button{border:0;background:none;color:var(--ink);padding:8px;text-align:left}.resource-item .remove{color:var(--muted);text-align:center}.resource-item b,.resource-item small{display:block}.resource-item b{font-size:10px}.resource-item small{margin-top:3px;color:var(--muted);font:7px var(--mono)}.none{padding:28px;color:var(--muted);text-align:center}.reader-nav .lesson-nav{padding:7px 9px 7px 40px;border:0;background:none;color:var(--muted);font-size:9px;text-align:left}.reader-nav .lesson-nav.on{color:var(--accent)}.reader-hero{position:relative;padding:clamp(30px,5vw,65px)}.reader-hero h1{max-width:900px;margin:13px 0;font:500 clamp(40px,5vw,66px)/1 var(--serif);letter-spacing:-.035em}.reader-hero p{max-width:720px;color:var(--muted);font-size:15px;line-height:1.6}.question{max-width:700px;margin-top:23px;padding:13px 16px;border-left:2px solid var(--warm);background:color-mix(in srgb,var(--warm) 7%,transparent);font:italic 16px/1.5 var(--serif)}.toc header,.reader-resources>header{display:flex;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #ffffff14}.toc h2,.reader-resources h2{margin:4px 0 0;font:500 22px var(--serif)}.toc-item{width:100%;display:grid;grid-template-columns:38px 1fr auto;gap:12px;padding:16px 20px;border:0;border-bottom:1px solid #ffffff11;background:none;color:var(--ink);text-align:left}.toc-item>span{color:var(--warm);font:900 9px var(--mono)}.toc-item h3{margin:0 0 3px;font-size:13px}.toc-item p{margin:0;color:var(--muted);font-size:10px}.toc-item small{color:var(--muted);font:8px var(--mono)}.reader-resources .audience{padding:0 19px 15px}.reader-resources a{display:grid;grid-template-columns:1fr 18px;padding:9px;border-bottom:1px solid #ffffff0d;color:var(--ink);text-decoration:none}.reader-resources a b,.reader-resources a small{display:block}.reader-resources a b{font-size:10px}.reader-resources a small{margin-top:3px;color:var(--muted);font-size:8px}.objectives{padding:20px;border-radius:21px}.objectives h2{font:500 22px var(--serif)}.objectives li{margin:8px 0;color:var(--muted);line-height:1.45}.back{border:0;background:none;color:var(--accent);font:800 8px var(--mono)}dialog{width:min(680px,94vw);max-height:90vh;padding:0;border:1px solid color-mix(in srgb,#74c7ff 36%,#ffffff1a);border-radius:20px;color:#f7f5ed;background:linear-gradient(180deg,#102a4a,#091a32);box-shadow:0 0 40px #74c7ff22,0 30px 90px #000c}dialog::backdrop{background:#000b}dialog header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #ffffff17}dialog h2{margin:4px 0 0;font:500 21px var(--serif)}dialog header button{border:0;background:none;color:#aebed4;font-size:22px}.form{display:grid;gap:12px;padding:18px}.form input,.form select,.form textarea{width:100%}.form .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form-actions{display:flex;justify-content:flex-end;gap:7px}.toast{position:fixed;z-index:50;right:20px;bottom:20px;padding:11px 14px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:11px;background:var(--panel);font:800 9px var(--mono);box-shadow:0 16px 50px #000a}.reader-only-note{color:var(--warm);font:800 8px var(--mono)}@media(max-width:800px){.top{align-items:flex-start}.brand small,.hide-mobile{display:none}.layout{display:block;padding:8px}.side{position:relative;top:auto;height:auto;max-height:360px;margin-bottom:9px}.curriculum-head{display:grid}.curriculum-head label{width:100%}.module-top{grid-template-columns:50px 1fr}.module-tools{grid-column:1/-1}.lesson-edit .row,.form .row{grid-template-columns:1fr}.type-grid{grid-template-columns:1fr}.empty{padding:35px 22px}.empty h1{font-size:48px}}
  </style>
</head>
<body>
<div id="app"></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<dialog id="modal"></dialog>
<script>
(()=>{
  const KEY='curriculum-builder-standalone-v1';
  const palettes={
    'blue-gold':['Blue · White · Dark Gold','#050b18','#0a1d38','#102a4a','#f7f5ed','#aebed4','#74c7ff','#236fc3','#b9974f'],
    'midnight-silver':['Midnight · Cyan · Silver','#050910','#101b2b','#17283a','#f1f6fb','#aab9c8','#8de8ff','#4387a9','#c2cbd4'],
    'forest-gold':['Forest · Parchment · Gold','#07100d','#10271f','#18362b','#f5f0df','#b9c2ad','#9ed8ba','#427b60','#c7a657'],
    'plum-rose':['Plum · Ivory · Rose Gold','#100812','#29142f','#38203e','#fbf1ec','#cab6c9','#e7b8df','#8f568f','#c99079'],
    'burgundy-brass':['Burgundy · Cream · Brass','#12090a','#32161a','#452127','#f8efe1','#cdb8ae','#efb6a1','#914852','#c09a55'],
    'charcoal-copper':['Charcoal · Ice · Copper','#080a0c','#1b2229','#26313a','#eef6f8','#aebbc0','#b8ecf5','#5e8791','#c68658']
  };
  const types=['lesson-plan','slides','worksheet','reading','document','assessment','video','other'];
  const labels={'lesson-plan':'Lesson plans',slides:'Slide decks',worksheet:'Worksheets',reading:'Readings',document:'Documents',assessment:'Assessments',video:'Videos',other:'Other'};
  const icons={'lesson-plan':'☷',slides:'▣',worksheet:'✎',reading:'◫',document:'▤',assessment:'✓',video:'▶',other:'◇'};
  const audiences=[['student','Student-facing materials'],['both','Shared materials'],['teacher','Teacher-facing materials']];
  let library=load(),activeId=library.activeId,selectedModule=null,selectedLesson=null,mode='build',readerOnly=false,externalCurriculum=null;
  const app=document.getElementById('app'),modal=document.getElementById('modal'),fileInput=document.getElementById('importFile');
  const id=p=>p+'_'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||{format:'curriculum-builder-library',version:1,activeId:null,curricula:[]}}catch{return{format:'curriculum-builder-library',version:1,activeId:null,curricula:[]}}}
  function save(){library.activeId=activeId;localStorage.setItem(KEY,JSON.stringify(library))}
  function current(){return externalCurriculum||library.curricula.find(c=>c.id===activeId)||null}
  function update(fn){const i=library.curricula.findIndex(c=>c.id===activeId);if(i<0)return;library.curricula[i]=fn(library.curricula[i]);library.curricula[i].updatedAt=new Date().toISOString();save();render()}
  function notify(text){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=text;document.body.append(n);setTimeout(()=>n.remove(),2400)}
  function theme(c){const p=palettes[c?.palette]||palettes['blue-gold'];return `--bg0:${p[1]};--bg1:${p[2]};--panel:${p[3]};--ink:${p[4]};--muted:${p[5]};--accent:${p[6]};--metal:${p[7]};--warm:${p[8]}`}
  function top(c){return `<header class="top"><button class="brand" data-home><span class="mark">CB</span><span><b>Curriculum Builder</b><small>HOLOGRAPHIC DEPLOYMENT CONSOLE</small></span></button><div class="actions">${c&&!readerOnly?`<button class="btn ghost ${mode==='build'?'on':''}" data-mode="build">Build</button><button class="btn ghost ${mode==='reader'?'on':''}" data-mode="reader">Reader preview</button>`:''}${readerOnly?'<span class="reader-only-note">READER DEPLOYMENT</span>':''}<button class="btn ghost hide-mobile" data-import>Import JSON</button>${!readerOnly?'<button class="btn primary" data-new>＋ New curriculum</button>':''}</div></header>`}
  function empty(){return `<main class="app" style="${theme()}">${top(null)}<section class="empty"><span class="eyebrow">PORTABLE CURRICULUM PUBLISHING</span><h1>Build the learning path.<br><em>Deploy the experience.</em></h1><p>Create modular curricula, connect Google materials, export portable source and reader JSON files, and publish a polished curriculum experience from one standalone page.</p><div class="actions"><button class="btn primary" data-new>Create your first curriculum</button><button class="btn ghost" data-import>Import source JSON</button></div></section></main>`}
  function grouped(resources,editable,target){if(!resources?.length)return '<p class="none">No resources linked yet.</p>';return audiences.map(([aud,label])=>{const boxes=types.map(type=>{const items=resources.filter(r=>r.audience===aud&&r.type===type);if(!items.length)return'';return `<div class="type-box"><header><span>${icons[type]}</span><b>${labels[type]}</b><small>${items.length}</small></header>${items.map(r=>editable?`<div class="resource-item"><button data-edit-resource="${r.id}" data-target-kind="${target.kind}" data-target-id="${target.id}"><b>${esc(r.name)}</b><small>Edit or move</small></button><button class="remove" data-delete-resource="${r.id}">×</button></div>`:`<a href="${esc(r.url)}" target="_blank" rel="noopener"><div><b>${esc(r.name)}</b><small>${esc(r.description||labels[r.type])}</small></div><i>↗</i></a>`).join('')}</div>`}).join('');return boxes?`<section class="audience ${aud}"><h4>${label}</h4><div class="type-grid">${boxes}</div></section>`:''}).join('')}
  function resourceSection(title,resources,target){return `<section class="resource-section"><div class="resource-head"><span>${title}</span><button data-add-resource data-target-kind="${target.kind}" data-target-id="${target.id}">＋ Link Google resource</button></div>${grouped(resources,true,target)}</section>`}
  function side(c,reader=false){const lessons=c.modules.reduce((n,m)=>n+m.lessons.length,0),resources=c.modules.reduce((n,m)=>n+m.resources.length+m.lessons.reduce((x,l)=>x+l.resources.length,0),0);return `<aside class="side glass ${reader?'reader-nav':''}"><div class="side-head"><span class="eyebrow">${reader?'CURRICULUM READER':'CURRICULUM LIBRARY'}</span>${reader?`<h3>${esc(c.title)}</h3>`:`<select id="curriculumSelect">${library.curricula.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select>`}</div>${!reader?`<div class="stats"><div><b>${c.modules.length}</b><span>Modules</span></div><div><b>${lessons}</b><span>Lessons</span></div><div><b>${resources}</b><span>Resources</span></div></div>`:''}<div class="structure-title"><span>STRUCTURE</span>${!reader?'<button data-add-module>＋ Module</button>':''}</div><div class="modules">${c.modules.map((m,i)=>`<button class="module-link ${m.id===selectedModule?'on':''}" data-module="${m.id}"><span>${String(i+1).padStart(2,'0')}</span><div><b>${esc(m.title)}</b><small>${m.lessons.length} lesson${m.lessons.length===1?'':'s'}</small></div></button>${reader&&m.id===selectedModule?m.lessons.map((l,li)=>`<button class="lesson-nav ${l.id===selectedLesson?'on':''}" data-lesson="${l.id}">${i+1}.${li+1} ${esc(l.title)}</button>`).join(''):''}`).join('')||'<p class="none">No modules yet.</p>'}</div>${!reader?'<div class="exports"><button data-export="source">⇩ Source JSON</button><button data-export="reader">⇩ Reader JSON</button></div>':''}</aside>`}
  function builder(c){let m=c.modules.find(x=>x.id===selectedModule)||c.modules[0]||null;if(m&&!selectedModule)selectedModule=m.id;let l=m?.lessons.find(x=>x.id===selectedLesson)||null;return `<main class="app" style="${theme(c)}">${top(c)}<div class="layout">${side(c)}<section class="workspace"><header class="curriculum-head glass"><div><span class="eyebrow">ACTIVE CURRICULUM</span><input class="title" id="curriculumTitle" value="${esc(c.title)}"><input class="subtitle" id="curriculumSubtitle" placeholder="Add a concise description" value="${esc(c.subtitle)}"></div><label><small>COLOR SYSTEM</small><select id="palette">${Object.entries(palettes).map(([k,v])=>`<option value="${k}" ${k===c.palette?'selected':''}>${v[0]}</option>`).join('')}</select></label></header>${!m?`<div class="module-editor glass none"><h2>Create your first module</h2><button class="btn primary" data-add-module>＋ Add module</button></div>`:`<article class="module-editor glass"><div class="module-top"><div class="module-num">${String(c.modules.indexOf(m)+1).padStart(2,'0')}</div><div><label>MODULE NAME<input id="moduleTitle" value="${esc(m.title)}"></label><label>MODULE DESCRIPTION<textarea id="moduleDescription" rows="2">${esc(m.description)}</textarea></label></div><div class="module-tools"><button data-move-module="-1">↑</button><button data-move-module="1">↓</button><button class="danger" data-delete-module>Delete</button></div></div><div class="essential"><label>ESSENTIAL QUESTION<input id="essential" value="${esc(m.essentialQuestion)}" placeholder="What question guides this module?"></label></div>${resourceSection('MODULE MATERIALS',m.resources,{kind:'module',id:m.id})}<div class="section-head"><div><span class="eyebrow">AUTOMATIC TABLE OF CONTENTS</span><h3>${m.lessons.length} lesson${m.lessons.length===1?'':'s'}</h3></div><button class="btn primary" data-add-lesson>＋ Add lesson</button></div><div class="lesson-list">${m.lessons.map((x,i)=>`<button class="lesson-card ${x.id===selectedLesson?'on':''}" data-lesson="${x.id}"><span>${String(i+1).padStart(2,'0')}</span><div><b>${esc(x.title)}</b><small>${esc(x.duration||'Duration not set')} · ${x.resources.length} resources</small></div></button>`).join('')||'<button class="lesson-card" data-add-lesson><span>＋</span><b>Add the first lesson</b></button>'}</div>${l?`<section class="lesson-edit"><div class="actions" style="justify-content:space-between"><span class="eyebrow">LESSON DETAILS</span><button class="btn ghost danger" data-delete-lesson>Delete lesson</button></div><label>LESSON TITLE<input id="lessonTitle" value="${esc(l.title)}"></label><div class="row"><label>DURATION<input id="lessonDuration" value="${esc(l.duration)}"></label><label>DESCRIPTION<input id="lessonDescription" value="${esc(l.description)}"></label></div><label>LEARNING OBJECTIVES<textarea id="objectives" rows="3">${esc(l.objectives)}</textarea></label>${resourceSection('LESSON MATERIALS',l.resources,{kind:'lesson',id:l.id})}</section>`:''}</article>`}</section></div></main>`}
  function reader(c){let m=c.modules.find(x=>x.id===selectedModule)||c.modules[0]||null;if(m&&!selectedModule)selectedModule=m.id;let l=m?.lessons.find(x=>x.id===selectedLesson)||null;let stage='';if(!m)stage='<div class="reader-hero glass"><h1>'+esc(c.title)+'</h1><p>This curriculum is ready for its first module.</p></div>';else if(l){const mi=c.modules.indexOf(m),li=m.lessons.indexOf(l);stage=`<button class="back" data-back>← Module contents</button><article class="reader-hero glass"><span class="eyebrow">MODULE ${mi+1} · LESSON ${li+1}</span><h1>${esc(l.title)}</h1><p>${esc(l.description||'Lesson materials and learning objectives')}</p></article>${l.objectives?`<section class="objectives glass"><span class="eyebrow">LEARNING OBJECTIVES</span><h2>By the end of this lesson</h2><ol>${l.objectives.split('\n').filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></section>`:''}<section class="reader-resources glass"><header><div><span class="eyebrow">RESOURCES</span><h2>Lesson materials</h2></div></header>${grouped(l.resources,false,{})}</section>`}else{const mi=c.modules.indexOf(m);stage=`<article class="reader-hero glass"><span class="eyebrow">MODULE ${String(mi+1).padStart(2,'0')}</span><h1>${esc(m.title)}</h1><p>${esc(m.description||'Module overview')}</p>${m.essentialQuestion?`<div class="question"><span class="eyebrow">ESSENTIAL QUESTION</span>${esc(m.essentialQuestion)}</div>`:''}</article>${m.resources.length?`<section class="reader-resources glass"><header><div><span class="eyebrow">RESOURCES</span><h2>Module materials</h2></div></header>${grouped(m.resources,false,{})}</section>`:''}<section class="toc glass"><header><div><span class="eyebrow">TABLE OF CONTENTS</span><h2>Learning sequence</h2></div></header>${m.lessons.map((x,i)=>`<button class="toc-item" data-lesson="${x.id}"><span>${String(i+1).padStart(2,'0')}</span><div><h3>${esc(x.title)}</h3><p>${esc(x.description||'Open lesson details and materials')}</p></div><small>${esc(x.duration||'—')}</small></button>`).join('')||'<p class="none">Lessons will appear here as the curriculum is built.</p>'}</section>`}return `<main class="app" style="${theme(c)}">${top(c)}<div class="layout">${side(c,true)}<section class="workspace">${stage}</section></div></main>`}
  function render(){const c=current();app.innerHTML=!c?empty():(mode==='reader'||readerOnly?reader(c):builder(c));bind()}
  function bind(){document.querySelectorAll('[data-new]').forEach(x=>x.onclick=newCurriculum);document.querySelectorAll('[data-import]').forEach(x=>x.onclick=()=>fileInput.click());document.querySelector('[data-home]')?.addEventListener('click',()=>{if(readerOnly)return;mode='build';render()});document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{mode=x.dataset.mode;render()});document.querySelectorAll('[data-module]').forEach(x=>x.onclick=()=>{selectedModule=x.dataset.module;selectedLesson=null;render()});document.querySelectorAll('[data-lesson]').forEach(x=>x.onclick=()=>{selectedLesson=x.dataset.lesson;render()});document.querySelector('[data-back]')?.addEventListener('click',()=>{selectedLesson=null;render()});document.querySelectorAll('[data-add-module]').forEach(x=>x.onclick=addModule);document.querySelectorAll('[data-add-lesson]').forEach(x=>x.onclick=addLesson);document.querySelectorAll('[data-add-resource]').forEach(x=>x.onclick=()=>resourceDialog(null,{kind:x.dataset.targetKind,id:x.dataset.targetId}));document.querySelectorAll('[data-edit-resource]').forEach(x=>x.onclick=()=>resourceDialog(findResource(x.dataset.editResource),{kind:x.dataset.targetKind,id:x.dataset.targetId}));document.querySelectorAll('[data-delete-resource]').forEach(x=>x.onclick=()=>deleteResource(x.dataset.deleteResource));document.querySelectorAll('[data-export]').forEach(x=>x.onclick=()=>exportJson(x.dataset.export));document.querySelector('[data-delete-module]')?.addEventListener('click',deleteModule);document.querySelector('[data-delete-lesson]')?.addEventListener('click',deleteLesson);document.querySelectorAll('[data-move-module]').forEach(x=>x.onclick=()=>moveModule(Number(x.dataset.moveModule)));const select=document.getElementById('curriculumSelect');if(select)select.onchange=()=>{activeId=select.value;selectedModule=selectedLesson=null;save();render()};bindValue('curriculumTitle',v=>update(c=>({...c,title:v})));bindValue('curriculumSubtitle',v=>update(c=>({...c,subtitle:v})));bindValue('palette',v=>update(c=>({...c,palette:v})));bindModule('moduleTitle','title');bindModule('moduleDescription','description');bindModule('essential','essentialQuestion');bindLesson('lessonTitle','title');bindLesson('lessonDuration','duration');bindLesson('lessonDescription','description');bindLesson('objectives','objectives')}
  function bindValue(el,fn){const x=document.getElementById(el);if(x)x.onchange=()=>fn(x.value)}
  function bindModule(el,key){bindValue(el,v=>update(c=>({...c,modules:c.modules.map(m=>m.id===selectedModule?{...m,[key]:v}:m)})))}
  function bindLesson(el,key){bindValue(el,v=>update(c=>({...c,modules:c.modules.map(m=>({...m,lessons:m.lessons.map(l=>l.id===selectedLesson?{...l,[key]:v}:l)}))})))}
  function show(title,subtitle,body,onSubmit){modal.innerHTML=`<header><div><span class="eyebrow">${subtitle}</span><h2>${title}</h2></div><button type="button" data-close>×</button></header><form class="form">${body}<div class="form-actions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary">Save</button></div></form>`;modal.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>modal.close());modal.querySelector('form').onsubmit=e=>{e.preventDefault();onSubmit(new FormData(e.target))};modal.showModal()}
  function newCurriculum(){show('Create a curriculum','NEW DEPLOYMENT SOURCE',`<label>CURRICULUM NAME<input name="title" required autofocus></label><label>DESCRIPTION<input name="subtitle"></label><label>COLOR SYSTEM<select name="palette">${Object.entries(palettes).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select></label>`,f=>{const now=new Date().toISOString(),c={schemaVersion:1,id:id('curriculum'),title:f.get('title').trim(),subtitle:f.get('subtitle').trim(),author:'',palette:f.get('palette'),createdAt:now,updatedAt:now,modules:[]};library.curricula.push(c);activeId=c.id;selectedModule=selectedLesson=null;save();modal.close();render()})}
  function addModule(){show('Add module','EXTEND THE LEARNING PATH','<label>MODULE NAME<input name="title" required autofocus></label><label>DESCRIPTION<textarea name="description" rows="3"></textarea></label>',f=>{const m={id:id('module'),title:f.get('title').trim(),description:f.get('description').trim(),essentialQuestion:'',resources:[],lessons:[]};update(c=>({...c,modules:[...c.modules,m]}));selectedModule=m.id;modal.close();render()})}
  function addLesson(){if(!selectedModule)return;show('Add lesson','BUILD THE SEQUENCE','<label>LESSON TITLE<input name="title" required autofocus></label><label>DURATION<input name="duration" placeholder="e.g. 55 minutes"></label>',f=>{const l={id:id('lesson'),title:f.get('title').trim(),description:'',duration:f.get('duration').trim(),objectives:'',resources:[]};update(c=>({...c,modules:c.modules.map(m=>m.id===selectedModule?{...m,lessons:[...m.lessons,l]}:m)}));selectedLesson=l.id;modal.close();render()})}
  function placements(c,selected){return c.modules.map((m,mi)=>`<optgroup label="Module ${mi+1}: ${esc(m.title)}"><option value="module:${m.id}" ${selected===`module:${m.id}`?'selected':''}>Module materials</option>${m.lessons.map((l,li)=>`<option value="lesson:${l.id}" ${selected===`lesson:${l.id}`?'selected':''}>Lesson ${mi+1}.${li+1}: ${esc(l.title)}</option>`).join('')}</optgroup>`).join('')}
  function resourceDialog(r,target){show(r?'Edit or move resource':'Link a Google resource',r?'RESOURCE MANAGEMENT':'EXTERNAL MATERIAL',`<label>DISPLAY NAME<input name="name" required autofocus value="${esc(r?.name||'')}"></label><label>GOOGLE DRIVE URL<input name="url" type="url" required value="${esc(r?.url||'')}"></label><div class="row"><label>RESOURCE TYPE<select name="type">${types.map(t=>`<option value="${t}" ${r?.type===t?'selected':''}>${labels[t]}</option>`).join('')}</select></label><label>AUDIENCE<select name="audience"><option value="student" ${r?.audience==='student'?'selected':''}>Student-facing</option><option value="both" ${!r||r.audience==='both'?'selected':''}>Teacher and student</option><option value="teacher" ${r?.audience==='teacher'?'selected':''}>Teacher-facing</option></select></label></div><label>PLACEMENT<select name="placement">${placements(current(),`${target.kind}:${target.id}`)}</select><small>Move resources between modules and lessons here.</small></label><label>DESCRIPTION<input name="description" value="${esc(r?.description||'')}"></label>`,f=>{const [kind,targetId]=f.get('placement').split(':'),resource={id:r?.id||id('resource'),name:f.get('name').trim(),url:f.get('url').trim(),type:f.get('type'),audience:f.get('audience'),description:f.get('description').trim()};update(c=>placeResource(c,resource,{kind,id:targetId}));modal.close();notify(r?'Resource updated':'Resource linked')})}
  function placeResource(c,r,t){let modules=c.modules.map(m=>({...m,resources:m.resources.filter(x=>x.id!==r.id),lessons:m.lessons.map(l=>({...l,resources:l.resources.filter(x=>x.id!==r.id)}))}));modules=modules.map(m=>t.kind==='module'&&m.id===t.id?{...m,resources:[...m.resources,r]}:{...m,lessons:m.lessons.map(l=>t.kind==='lesson'&&l.id===t.id?{...l,resources:[...l.resources,r]}:l)});return{...c,modules}}
  function findResource(rid){for(const m of current().modules){const a=m.resources.find(r=>r.id===rid);if(a)return a;for(const l of m.lessons){const b=l.resources.find(r=>r.id===rid);if(b)return b}}}
  function deleteResource(rid){if(!confirm('Remove this resource link?'))return;update(c=>({...c,modules:c.modules.map(m=>({...m,resources:m.resources.filter(r=>r.id!==rid),lessons:m.lessons.map(l=>({...l,resources:l.resources.filter(r=>r.id!==rid)}))}))}))}
  function deleteModule(){if(!confirm('Delete this module and all of its lessons?'))return;update(c=>({...c,modules:c.modules.filter(m=>m.id!==selectedModule)}));selectedModule=selectedLesson=null;render()}
  function deleteLesson(){if(!confirm('Delete this lesson and its resource links?'))return;update(c=>({...c,modules:c.modules.map(m=>({...m,lessons:m.lessons.filter(l=>l.id!==selectedLesson)}))}));selectedLesson=null;render()}
  function moveModule(delta){update(c=>{const a=[...c.modules],i=a.findIndex(m=>m.id===selectedModule),j=i+delta;if(j<0||j>=a.length)return c;[a[i],a[j]]=[a[j],a[i]];return{...c,modules:a}})}
  function exportJson(kind){const c=current(),slug=c.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'curriculum',payload=kind==='source'?{format:'curriculum-builder-source',exportKind:'developer-source',...c}:{format:'curriculum-builder-reader',schemaVersion:1,exportKind:'reader-deployment',curriculum:c};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download=`${slug}-${kind}.json`;a.click();URL.revokeObjectURL(a.href);notify(kind==='source'?'Source JSON exported':'Reader JSON exported')}
  fileInput.onchange=()=>{const file=fileInput.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const raw=JSON.parse(reader.result);if(raw.format==='curriculum-builder-reader'){externalCurriculum=raw.curriculum;readerOnly=true;mode='reader';selectedModule=selectedLesson=null}else if(['curriculum-builder-source','curriculum-forge'].includes(raw.format)){library.curricula=library.curricula.filter(c=>c.id!==raw.id);library.curricula.push(raw);activeId=raw.id;externalCurriculum=null;readerOnly=false;mode='build';save()}else throw 0;render();notify('JSON loaded')}catch{alert('That is not a valid Curriculum Builder JSON file.')}fileInput.value=''};reader.readAsText(file)};
  async function loadHosted(){const src=new URLSearchParams(location.search).get('curriculum');if(!src)return false;try{const res=await fetch(src);if(!res.ok)throw 0;const raw=await res.json();externalCurriculum=raw.format==='curriculum-builder-reader'?raw.curriculum:raw;readerOnly=true;mode='reader';return true}catch{alert('The hosted curriculum JSON could not be loaded.');return false}}
  loadHosted().finally(render);
})();
</script>
</body>
